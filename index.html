<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3b82f6">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>輪班班表</title>
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #1d4ed8;
      --primary-light: #dbeafe;
      --bg: #eef2f7;
      --bg-gradient-1: #eef2ff;
      --bg-gradient-2: #fdf2f8;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --error: #dc2626;
      --green: #16a34a;
      --green-light: #dcfce7;
      --orange: #ea580c;
      --purple: #8b5cf6;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.08), 0 2px 6px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.14), 0 4px 12px rgba(15, 23, 42, 0.08);
      --radius: 14px;
      --radius-sm: 10px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif;
      background: linear-gradient(160deg, var(--bg-gradient-1) 0%, var(--bg) 45%, var(--bg-gradient-2) 100%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 48px;
      line-height: 1.6;
    }
    .container { max-width: 1000px; margin: 0 auto; }

    header {
      text-align: center;
      margin-bottom: 24px;
      padding: 12px 0;
    }
    h1 {
      font-size: 30px;
      letter-spacing: 1px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--purple) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      display: inline-block;
    }
    .subtitle { font-size: 14px; color: var(--muted); }
    .help-link {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 14px;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary-dark);
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid #bfdbfe;
      border-radius: 20px;
      text-decoration: none;
    }
    .help-link:hover { background: var(--primary-light); }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-md);
      margin-bottom: 20px;
      border: 1px solid rgba(226, 232, 240, 0.6);
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .person-settings {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 18px;
      background: #fafbfd;
      transition: var(--transition);
    }
    .person-settings:hover { border-color: #c7d2fe; box-shadow: var(--shadow-sm); }
    .person-settings h3 {
      font-size: 16px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }
    .person-settings h3 .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
    }
    .person-settings h3 .dot-me { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .person-settings h3 .dot-bk { background: linear-gradient(135deg, #a78bfa, #7c3aed); }

    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--muted);
    }
    .field input, .field select {
      width: 100%;
      padding: 11px 14px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input:focus, .field select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .field input[type="text"] {
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    .field input.name-input {
      font-family: inherit;
      letter-spacing: 0;
    }

    .user-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .user-bar label {
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }
    .user-bar select {
      flex: 1;
      min-width: 120px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      background: #fff;
      color: var(--text);
    }
    .user-bar select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .btn-user-add, .btn-user-del {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }
    .btn-user-add {
      background: var(--primary);
      color: #fff;
      border: 1px solid var(--primary);
    }
    .btn-user-add:hover { background: var(--primary-dark); }
    .btn-user-del {
      background: #fff;
      color: var(--error);
      border: 1px solid #fecaca;
    }
    .btn-user-del:hover { background: #fef2f2; }
    .btn-user-sub {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      background: #fff;
      color: var(--primary);
      border: 1px solid #bfdbfe;
      transition: var(--transition);
    }
    .btn-user-sub:hover { background: var(--primary-light); }
    .btn-preset {
      margin-top: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      color: var(--primary-dark);
      cursor: pointer;
    }
    .btn-preset:hover { background: var(--primary-light); }
    .team-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .team-row .team-label { font-size: 12px; font-weight: 600; color: var(--muted); margin-right: 2px; }
    .btn-team {
      min-width: 40px;
      padding: 7px 10px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid #bfdbfe;
      background: #fff;
      color: var(--primary-dark);
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-team:hover { background: var(--primary-light); }
    .btn-team.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .team-tag {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary-dark);
      background: var(--primary-light);
      padding: 2px 8px;
      border-radius: 10px;
    }
    .modal select.team-select { margin-bottom: 10px; }
    .act-settings { grid-column: 1 / -1; }
    .act-name-row { display: flex; gap: 8px; }
    .field input.act-icon { width: 64px; flex: none; text-align: center; font-size: 18px; padding: 8px; }
    .icon-picks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .icon-picks button {
      width: 38px;
      height: 38px;
      font-size: 18px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
    }
    .icon-picks button:hover { border-color: var(--primary); background: var(--primary-light); }
    .act-checks .check-row { font-size: 13px; margin-bottom: 6px; color: var(--text); }
    .act-checks .check-row input, .act-settings > .check-row input { width: 16px; height: 16px; flex: none; }
    .legend-act { font-size: 14px; }
    .legend-box.leave { background: #fef3c7; border: 1px solid #fcd34d; }
    .legend-box.ot { background: #fff; border: 2px dashed #f59e0b; }
    .shift-badge.leave { background: #fef3c7; color: #b45309; border: 1px solid #fcd34d; }
    .shift-badge.ot { box-shadow: inset 0 0 0 2px #f59e0b; }
    .ev-tag {
      display: block;
      width: fit-content;
      max-width: 100%;
      margin: 1px auto;
      padding: 0 6px;
      font-size: 10px;
      font-weight: 700;
      color: #b45309;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ev-person {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      background: #fafbfd;
    }
    .ev-person .ev-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 14px; }
    .ev-person .ev-state { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .ev-person .ev-state b { color: #b45309; }
    .ev-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .ev-btns button, .ev-form button {
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid #fcd34d;
      background: #fffbeb;
      color: #b45309;
      cursor: pointer;
    }
    .ev-btns button:hover, .ev-form button:hover { background: #fef3c7; }
    .ev-btns button.ev-del { border-color: #fecaca; background: #fff; color: var(--error); }
    .ev-form { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
    .ev-form .ev-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; font-size: 13px; }
    .ev-form select, .ev-form input[type="number"] {
      padding: 8px 10px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      width: auto;
    }
    .ev-form input[type="number"] { width: 90px; }
    .ev-form label.radio { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
    .ev-form .ev-hint { font-size: 12px; color: var(--muted); }
    .ev-form button.ev-save { background: var(--primary); border-color: var(--primary); color: #fff; }
    .modal { max-height: calc(100vh - 32px); overflow-y: auto; }

    .leave-card h2 { font-size: 18px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .leave-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
    .leave-person { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; background: #fafbfd; }
    .leave-person h3 { font-size: 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .quota-row { margin-bottom: 12px; font-size: 14px; }
    .quota-row .q-top { display: flex; justify-content: space-between; align-items: baseline; }
    .quota-row .q-name { font-weight: 700; }
    .quota-row .q-left { font-size: 20px; }
    .quota-row .q-sub { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 4px 0 6px; }
    .quota-row input {
      width: 64px;
      padding: 6px 8px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-align: center;
    }
    .quota-row .q-left { font-weight: 800; color: var(--green); }
    .quota-row .q-left.neg { color: var(--error); }
    .quota-bar { height: 6px; border-radius: 3px; background: #e2e8f0; overflow: hidden; }
    .quota-bar > span { display: block; height: 100%; background: linear-gradient(90deg, #f59e0b, #ea580c); }
    .leave-line { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.7; }
    .leave-line b { color: var(--text); }
    .leave-person details { margin-top: 10px; font-size: 13px; }
    .leave-person summary { cursor: pointer; color: var(--primary); font-weight: 600; }
    .leave-person ul { list-style: none; margin-top: 6px; max-height: 220px; overflow-y: auto; }
    .leave-person li { padding: 4px 0; border-bottom: 1px dashed var(--border); }
    .btn-finder {
      display: block;
      width: 100%;
      padding: 11px;
      margin: -6px 0 16px;
      border-radius: 10px;
      border: 1px solid #a7f3d0;
      background: linear-gradient(135deg, #ecfdf5, #d1fae5);
      color: #047857;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-finder:hover { box-shadow: var(--shadow-sm); transform: translateY(-1px); }
    .modal.finder { max-width: 520px; }
    .fd-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; }
    .fd-row > label.fd-lbl { width: 44px; font-weight: 700; color: var(--muted); flex: none; }
    .fd-row select, .fd-row input[type="date"] {
      padding: 8px 10px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-family: inherit;
      color: var(--text);
    }
    .fd-row input[type="date"] { flex: 1; min-width: 0; }
    .fd-row select.fd-who { flex: 1; min-width: 0; }
    .fd-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .fd-chips button {
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--muted);
      cursor: pointer;
    }
    .fd-chips button.active { background: #059669; border-color: #059669; color: #fff; }
    .fd-row label.chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .fd-sum { font-size: 14px; font-weight: 700; color: #047857; margin: 6px 0 8px; }
    .fd-list { list-style: none; max-height: 46vh; overflow-y: auto; border-top: 1px solid var(--border); }
    .fd-list li { padding: 9px 4px; border-bottom: 1px dashed var(--border); cursor: pointer; font-size: 14px; }
    .fd-list li:hover { background: #f0fdf4; }
    .fd-list .fd-days { display: inline-block; min-width: 44px; margin-left: 6px; padding: 1px 8px; font-size: 12px; font-weight: 700; border-radius: 10px; background: #d1fae5; color: #047857; text-align: center; }
    .fd-list .fd-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .fd-empty { padding: 18px 0; text-align: center; color: var(--muted); font-size: 14px; }
    .leave-person h3 .dot-me { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .leave-person h3 .dot-bk { background: linear-gradient(135deg, #a78bfa, #7c3aed); }
    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .share-input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      background: #f8fafc;
      color: var(--text);
    }
    .share-input:focus { border-color: var(--primary); }
    .dlg-sep { border: none; border-top: 1px dashed var(--border); margin: 14px 0; }
    .btn-link-danger {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
    }
    .btn-link-danger:hover { color: var(--error); }

    .legend {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
      font-size: 13px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
    }
    .legend-box {
      width: 22px;
      height: 15px;
      border-radius: 4px;
      display: inline-block;
    }
    .legend-box.day { background: linear-gradient(135deg, #3b82f6, #2563eb); }
    .legend-box.night { background: linear-gradient(135deg, #374151, #111827); }
    .legend-box.off { background: #fce7f3; border: 1px solid #f9a8d4; }
    .legend-box.both-off { background: #d1fae5; border: 1px solid #6ee7b7; }

    .view-toggle {
      display: flex;
      gap: 4px;
      background: #f1f5f9;
      border-radius: var(--radius-sm);
      padding: 5px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
    }
    .view-toggle button {
      flex: 1;
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: var(--muted);
      transition: var(--transition);
    }
    .view-toggle button.active {
      background: #fff;
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .view-toggle button:hover:not(.active) {
      color: var(--text);
      background: rgba(255,255,255,0.6);
    }

    .month-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    .month-nav h2 {
      font-size: 24px;
      font-weight: 700;
      min-width: 170px;
      text-align: center;
      color: var(--text);
      letter-spacing: 1px;
      cursor: pointer;
    }
    .month-nav h2:hover { color: var(--primary); }
    .nav-btn {
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      font-size: 20px;
      cursor: pointer;
      transition: var(--transition);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-btn:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary-dark);
      transform: scale(1.05);
    }
    .nav-btn:active { transform: scale(0.95); }
    .btn-today {
      padding: 9px 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: var(--primary);
      transition: var(--transition);
    }
    .btn-today:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .calendar {
      width: 100%;
      table-layout: fixed;   /* 欄寬固定在卡片內，內容不會把表格撐寬 */
      border-collapse: separate;
      border-spacing: 3px;
      font-size: 13px;
    }
    .calendar td { overflow: hidden; }
    .calendar th {
      padding: 10px 4px;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }
    .calendar th:first-child,
    .calendar th:last-child { color: #f43f5e; }

    .calendar td {
      padding: 8px 6px;
      text-align: center;
      vertical-align: top;
      height: 100px;
      border: 1px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      background: #fff;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }
    .calendar td:hover:not(.other-month) {
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
      z-index: 1;
    }
    .calendar td.other-month {
      background: transparent;
      color: #cbd5e1;
      cursor: default;
      box-shadow: none;
    }
    .calendar td.other-month .day-num { opacity: 0.4; }
    .calendar td.today { box-shadow: inset 0 0 0 2px var(--primary); }

    .day-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-bottom: 4px;
    }
    .day-num {
      display: block;
      text-align: center;
      width: 24px;
      height: 24px;
      line-height: 24px;
      font-size: 13px;
      font-weight: 700;
      color: #475569;
      background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
      border-radius: 50%;
      margin: 0;
      flex-shrink: 0;
    }
    .lunar-date {
      font-size: 10px;
      font-weight: 600;
      color: #b45309;
      white-space: nowrap;
      line-height: 1.2;
    }
    .calendar td.other-month .lunar-date { opacity: 0.4; }
    .calendar td.today .day-num {
      color: #dc2626;
      background: #fee2e2;
      box-shadow: 0 0 0 2px #ef4444;
    }
    .calendar td.other-month .day-num { color: #94a3b8; background: #f1f5f9; }

    .shift-badge {
      display: block;
      width: fit-content;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 2px auto;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }

      function fmtLocal(d) {
        var mm = ('0' + (d.getMonth() + 1)).slice(-2);
        var dd = ('0' + d.getDate()).slice(-2);
        return d.getFullYear() + '-' + mm + '-' + dd;
      }

      function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
      function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

      function randomHex(bytes) {
        var a = new Uint8Array(bytes);
        (window.crypto || window.msCrypto).getRandomValues(a);
        return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
      }

      // 舊代碼 1=夜 2=日 → 新代碼 1=日 2=夜
      function swapDayNight(s) {
        return String(s || '').replace(/[12]/g, function (ch) { return ch === '1' ? '2' : '1'; });
      }

      // 判斷某人的規則是否等於康寧某一班（比對今天起 28 天）
      function corningTeamOf(person) {
        if (!person || !person.pattern || !person.startDate) return null;
        var t0 = new Date();
        var teams = Object.keys(CORNING_TEAMS);
        for (var i = 0; i < teams.length; i++) {
          var same = true;
          for (var d = 0; d < 28 && same; d++) {
            var dt = new Date(t0.getFullYear(), t0.getMonth(), t0.getDate() + d);
            var y = dt.getFullYear(), m = dt.getMonth(), dd = dt.getDate();
            if (getShift(person.pattern, person.startDate, y, m, dd) !== getShift(CORNING_PATTERN, CORNING_TEAMS[teams[i]], y, m, dd)) same = false;
          }
          if (same) return teams[i];
        }
        return null;
      }

      function teamSelectHtml(id, selected) {
        var opts = '<option value="">不是康寧／之後再設定</option>';
        Object.keys(CORNING_TEAMS).forEach(function (t) {
          opts += '<option value="' + t + '"' + (t === selected ? ' selected' : '') + '>康寧 ' + t + ' 班</option>';
        });
        return '<div class="field"><label>康寧班別</label><select class="team-select" id="' + id + '">' + opts + '</select></div>';
      }

      // 共同休假標記：每組使用者可自訂（預設＝原本的運動日規則）
      var ACT_DEFAULT = { on: true, icon: '🏃', name: '運動', p1PrevNight: true, p2PrevNight: true, p1NextDay: false, p2NextDay: false };
      var ACT_KEYS = ['on', 'icon', 'name', 'p1PrevNight', 'p2PrevNight', 'p1NextDay', 'p2NextDay'];
      function actOf(p) {
        var a = (p && p.act) || {};
        var out = {};
        ACT_KEYS.forEach(function (k) { out[k] = (a[k] === undefined || a[k] === null) ? ACT_DEFAULT[k] : a[k]; });
        return out;
      }

      // ===== 請假／加班 =====
      var LEAVE_KINDS = ['特休', '彈性休', '事假', '病假', '婚假', '喪假', '公假', '其他'];
      var LEAVE_SHORT = { '特休': '特', '彈性休': '彈', '事假': '事', '病假': '病', '婚假': '婚', '喪假': '喪', '公假': '公', '其他': '假' };
      var QUOTA_KINDS = [['特休', 'annual'], ['彈性休', 'flex']];

      function normDate(y, m, d) { var dt = new Date(y, m, d); return [dt.getFullYear(), dt.getMonth(), dt.getDate()]; }
      function evKey(person, dk) { return person + '|' + dk; }
      function eventOf(u, person, y, m, d) {
        var n = normDate(y, m, d);
        return ((u && u.events) || {})[evKey(person, n[0] + '-' + (n[1] + 1) + '-' + n[2])] || null;
      }
      function baseShift(u, person, y, m, d) {
        var p = u[person];
        return getShift(p.pattern, p.startDate, y, m, d);
      }
      // 套用請假／加班之後的實際班別
      function effShift(u, person, y, m, d) {
        var b = baseShift(u, person, y, m, d);
        var e = eventOf(u, person, y, m, d);
        if (!e) return b;
        if (e.type === 'leave' && Number(e.days) >= 1 && b && b !== 'off') return 'off';
        if (e.type === 'ot' && e.shift) return e.shift;
        return b;
      }
      function fmtNum(n) { n = Math.round(Number(n || 0) * 100) / 100; return String(n); }
      function evText(e, withShift) {
        if (!e) return '';
        if (e.type === 'leave') return e.kind + ' ' + (Number(e.days) < 1 ? '半天' : '1 天');
        return '加班' + (withShift && e.shift ? '（' + shiftLabel(e.shift) + '）' : '') + ' ' + fmtNum(e.hours) + ' 小時';
      }
      function quotaOf(u, person, year) {
        var q = (((u.quota || {})[person]) || {})[String(year)] || {};
        return {
          annual: q.annual === undefined || q.annual === null ? 0 : Number(q.annual),
          flex: q.flex === undefined || q.flex === null ? (corningTeamOf(u[person]) ? 4 : 0) : Number(q.flex)
        };
      }
      function usageOf(u, person, year, month) {
        var r = { leave: {}, otYear: 0, otYearCount: 0, otMonth: 0, otMonthCount: 0, list: [] };
        Object.keys(u.events || {}).forEach(function (k) {
          var sp = k.split('|');
          if (sp[0] !== person) return;
          var dp = sp[1].split('-');
          if (Number(dp[0]) !== year) return;
          var e = u.events[k];
          r.list.push({ dk: sp[1], m: Number(dp[1]), d: Number(dp[2]), e: e });
          if (e.type === 'leave') {
            r.leave[e.kind] = (r.leave[e.kind] || 0) + Number(e.days || 0);
          } else {
            r.otYear += Number(e.hours || 0); r.otYearCount++;
            if (Number(dp[1]) - 1 === month) { r.otMonth += Number(e.hours || 0); r.otMonthCount++; }
          }
        });
        r.list.sort(function (a, b) { return a.m - b.m || a.d - b.d; });
        return r;
      }
      // 依 key 排序的 JSON，用來比對雲端與本機是否一致（jsonb 會重排 key）
      function stableStr(o) {
        if (o === null || typeof o !== 'object') return JSON.stringify(o === undefined ? null : o);
        if (Array.isArray(o)) return '[' + o.map(stableStr).join(',') + ']';
        return '{' + Object.keys(o).sort().map(function (k) { return JSON.stringify(k) + ':' + stableStr(o[k]); }).join(',') + '}';
      }
      function normEvent(e) {
        return { type: e.type, kind: e.kind || '', days: Number(e.days || 0), shift: e.shift || '', hours: Number(e.hours || 0) };
      }

      function isWsId(s) { return typeof s === 'string' && /^[0-9a-f]{32,128}$/.test(s); }

      function makeProfile(name, team) {
        var useCorning = !!CORNING_TEAMS[team];
        return {
          id: 'p' + randomHex(6),
          name: name,
          p1: { name: name, pattern: useCorning ? CORNING_PATTERN : '', startDate: useCorning ? CORNING_TEAMS[team] : fmtLocal(new Date()) },
          p2: { name: '伴侶', pattern: '', startDate: fmtLocal(new Date()) },
          sort: Date.now(),
          notes: {},
          events: {},
          quota: null
        };
      }

      function cur() {
        for (var i = 0; i < profiles.length; i++) if (profiles[i].id === currentId) return profiles[i];
        return profiles[0];
      }

      function ensureCurrent() {
        if (!profiles.length) { profiles = [makeProfile('我', null)]; unsavedDefault = true; }
        var p = cur();
        currentId = p.id;
        notes = p.notes || (p.notes = {});
        viewMode = viewPrefs[currentId] || 'both';
      }

      function saveLocal() {
        if (!wsId) return;
        lsSet(WS_KEY, wsId);
        lsSet(CACHE_PREFIX + wsId, JSON.stringify({ profiles: profiles, unsavedDefault: unsavedDefault }));
        lsSet(CURRENT_KEY, currentId || '');
        lsSet(VIEW_KEY, JSON.stringify(viewPrefs));
      }
      // 相容既有呼叫
      function saveUsers() { saveLocal(); }

      function saveView() {
        viewPrefs[currentId] = viewMode;
        saveLocal();
      }

      function loadWorkspace(id) {
        wsId = id;
        profiles = [];
        unsavedDefault = false;
        try {
          var c = JSON.parse(lsGet(CACHE_PREFIX + id) || 'null');
          if (!c) {
            c = JSON.parse(lsGet(OLD_CACHE_PREFIX + id) || 'null');
            if (c && c.profiles) c.profiles.forEach(function (p) {
              ['p1', 'p2'].forEach(function (k) { if (p[k]) p[k].pattern = swapDayNight(p[k].pattern); });
            });
          }
          if (c && c.profiles) { profiles = c.profiles; unsavedDefault = !!c.unsavedDefault; }
        } catch (e) {}
        try { viewPrefs = JSON.parse(lsGet(VIEW_KEY) || '{}') || {}; } catch (e) { viewPrefs = {}; }
        currentId = lsGet(CURRENT_KEY);
        ensureCurrent();
        saveLocal();
        sb = makeClient();
      }

      // ===== Supabase 雲端同步 =====
      function makeClient() {
        if (typeof supabase === 'undefined') return null;
        try {
          return supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            global: { headers: { 'x-shift-ws': wsId } },
            auth: { persistSession: false, autoRefreshToken: false }
          });
        } catch (e) { return null; }
      }

      function rowFromProfile(p) {
        return {
          ws: wsId, id: p.id, name: p.name,
          p1_name: p.p1.name || '', p1_pattern: p.p1.pattern || '', p1_start: p.p1.startDate || '',
          p2_name: p.p2.name || '', p2_pattern: p.p2.pattern || '', p2_start: p.p2.startDate || '',
          sort: p.sort || 0, updated_at: Date.now(),
          extra: { act: p.act || null, quota: p.quota || null }
        };
      }

      function profileFromRow(r) {
        return {
          id: r.id,
          name: r.name,
          p1: { name: r.p1_name, pattern: r.p1_pattern, startDate: r.p1_start },
          p2: { name: r.p2_name, pattern: r.p2_pattern, startDate: r.p2_start },
          sort: Number(r.sort) || 0,
          act: (r.extra && r.extra.act) || null,
          quota: (r.extra && r.extra.quota) || null,
          notes: {},
          events: {}
        };
      }

      function sigNotes(o) {
        return JSON.stringify(Object.keys(o || {}).sort().map(function (k) { return [k, o[k]]; }));
      }

      function sigProfiles(list) {
        return JSON.stringify(list.map(function (p) {
          var a = actOf(p);
          var evs = {};
          Object.keys(p.events || {}).forEach(function (k) { evs[k] = normEvent(p.events[k]); });
          return [p.id, p.name, p.p1.name, p.p1.pattern, p.p1.startDate, p.p2.name, p.p2.pattern, p.p2.startDate, sigNotes(p.notes),
            ACT_KEYS.map(function (k) { return a[k]; }), stableStr(p.quota || null), stableStr(evs)];
        }));
      }

      function fetchAll() {
        var startedAt = Date.now();
        var forWs = wsId;
        return Promise.all([
          sb.from('shift_profiles').select('*'),
          sb.from('shift_ws_notes').select('profile_id, date_key, note'),
          sb.from('shift_ws_events').select('profile_id, person, date_key, type, kind, days, shift, hours')
        ]).then(function (res) {
          if (res[0].error) throw res[0].error;
          if (res[1].error) throw res[1].error;
          if (res[2].error) throw res[2].error;
          return { profiles: res[0].data || [], notesRows: res[1].data || [], eventRows: res[2].data || [], startedAt: startedAt, ws: forWs };
        });
      }

      function applyData(d) {
        if (d.ws !== wsId) return;
        // 丟棄在本地最後一次儲存之前就發出的請求回應，避免蓋掉剛存好的資料
        if (d.startedAt < lastLocalSave) return;
        if (!d.profiles.length) {
          // 雲端還沒有這個空間的資料 → 把本機資料上傳
          pushAll();
          return;
        }
        var byId = {};
        var list = d.profiles.map(profileFromRow);
        list.forEach(function (p) { byId[p.id] = p; });
        d.notesRows.forEach(function (n) {
          if (n.note && byId[n.profile_id]) byId[n.profile_id].notes[n.date_key] = n.note;
        });
        d.eventRows.forEach(function (r) {
          if (byId[r.profile_id]) byId[r.profile_id].events[evKey(r.person, r.date_key)] = normEvent(r);
        });
        list.sort(function (a, b) { return a.sort - b.sort; });
        var changed = unsavedDefault || sigProfiles(list) !== sigProfiles(profiles);
        unsavedDefault = false;
        if (!changed) return;
        profiles = list;
        ensureCurrent();
        saveLocal();
        refreshUI();
      }

      function syncFail(res) {
        if (res && res.error) showToast('同步失敗：' + (res.error.message || ''));
      }

      function pushAll() {
        if (!sb) return;
        unsavedDefault = false;
        saveLocal();
        lastLocalSave = Date.now();
        sb.from('shift_profiles').upsert(profiles.map(rowFromProfile), { onConflict: 'ws,id' }).then(function (res) {
          syncFail(res);
          var rows = [];
          profiles.forEach(function (p) {
            Object.keys(p.notes || {}).forEach(function (k) {
              rows.push({ ws: wsId, profile_id: p.id, date_key: k, note: p.notes[k], updated_at: Date.now() });
            });
          });
          if (rows.length) sb.from('shift_ws_notes').upsert(rows, { onConflict: 'ws,profile_id,date_key' }).then(syncFail);
          var evRows = [];
          profiles.forEach(function (p) {
            Object.keys(p.events || {}).forEach(function (k) {
              var sp = k.split('|'), e = normEvent(p.events[k]);
              evRows.push({ ws: wsId, profile_id: p.id, person: sp[0], date_key: sp[1], type: e.type, kind: e.kind, days: e.days, shift: e.shift, hours: e.hours, updated_at: Date.now() });
            });
          });
          if (evRows.length) sb.from('shift_ws_events').upsert(evRows, { onConflict: 'ws,profile_id,person,date_key' }).then(syncFail);
        }).catch(function () { showToast('同步失敗'); });
      }

      function persistProfile(p) {
        lastLocalSave = Date.now();
        if (!sb) return;
        if (unsavedDefault) { pushAll(); return; }
        sb.from('shift_profiles').upsert([rowFromProfile(p)], { onConflict: 'ws,id' })
          .then(syncFail).catch(function () { showToast('同步失敗'); });
      }

      function persistNote(profileId, dk, val) {
        lastLocalSave = Date.now();
        if (!sb) return;
        if (unsavedDefault) { pushAll(); return; }
        var q = val
          ? sb.from('shift_ws_notes').upsert([{ ws: wsId, profile_id: profileId, date_key: dk, note: val, updated_at: Date.now() }], { onConflict: 'ws,profile_id,date_key' })
          : sb.from('shift_ws_notes').delete().eq('ws', wsId).eq('profile_id', profileId).eq('date_key', dk);
        q.then(function (res) { if (res && res.error) showToast('備註同步失敗'); })
          .catch(function () { showToast('備註同步失敗'); });
      }

      function persistEvent(profileId, person, dk, ev) {
        lastLocalSave = Date.now();
        if (!sb) return;
        if (unsavedDefault) { pushAll(); return; }
        var q;
        if (ev) {
          var e = normEvent(ev);
          q = sb.from('shift_ws_events').upsert([{ ws: wsId, profile_id: profileId, person: person, date_key: dk, type: e.type, kind: e.kind, days: e.days, shift: e.shift, hours: e.hours, updated_at: Date.now() }], { onConflict: 'ws,profile_id,person,date_key' });
        } else {
          q = sb.from('shift_ws_events').delete().eq('ws', wsId).eq('profile_id', profileId).eq('person', person).eq('date_key', dk);
        }
        q.then(function (res) { if (res && res.error) showToast('同步失敗：' + (res.error.message || '')); })
          .catch(function () { showToast('同步失敗'); });
      }

      function removeProfileCloud(profileId) {
        lastLocalSave = Date.now();
        if (!sb) return;
        sb.from('shift_ws_events').delete().eq('ws', wsId).eq('profile_id', profileId).then(function () {
          return sb.from('shift_ws_notes').delete().eq('ws', wsId).eq('profile_id', profileId);
        }).then(function () {
          return sb.from('shift_profiles').delete().eq('ws', wsId).eq('id', profileId);
        }).then(syncFail).catch(function () { showToast('同步失敗'); });
      }

      function refreshQuiet() {
        if (!sb) return;
        clearTimeout(syncTimer);
        syncTimer = setTimeout(function () {
          fetchAll().then(applyData).catch(function () {});
        }, 300);
      }

      function refreshUI() {
        loadForm();
        renderUserBar();
        initViewToggle();
        renderCalendar();
      }

      function startSync() {
        setInterval(refreshQuiet, 15000);
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) refreshQuiet();
        });
        refreshQuiet();
      }

      function showToast(msg) {
        var t = $('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(function() { t.classList.remove('show'); }, 2000);
      }

      function parseDate(str) {
        var parts = str.split('-');
        return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
      }

      function getShift(pattern, startDate, year, month, day) {
        if (!pattern || !startDate) return null;
        var start = parseDate(startDate);
        var target = new Date(year, month, day);
        var diffTime = target.getTime() - start.getTime();
        var diff = Math.floor(diffTime / (24 * 60 * 60 * 1000));
        if (diff < 0) return null;
        var idx = diff % pattern.length;
        var code = pattern[idx];
        if (code === '0') return 'off';
        if (code === '1') return 'day';
        if (code === '2') return 'night';
        return null;
      }

      function isMobile() {
        // 平板寬度（≤820px）也改用短標籤，避免格子擠不下
        return window.matchMedia ? window.matchMedia('(max-width: 820px)').matches : window.innerWidth <= 820;
      }

      function shortShiftLabel(shift) {
        if (shift === 'day') return '日';
        if (shift === 'night') return '夜';
        if (shift === 'off') return '休';
        return '';
      }

      function shiftLabel(shift) {
        if (shift === 'day') return '日班';
        if (shift === 'night') return '夜班';
        if (shift === 'off') return '休假';
        return '';
      }

      function personShort(name, fallback) {
        name = (name || '').trim();
        return name ? name.charAt(0) : fallback;
      }

      function lunarParts(y, m, d) {
        try {
          if (typeof Lunar === 'undefined') return null;
          var dt = new Date(y, m, d);
          var l = null;
          if (Lunar.fromDate) l = Lunar.fromDate(dt);
          else if (typeof Solar !== 'undefined' && Solar.fromDate) l = Solar.fromDate(dt).getLunar();
          if (!l) return null;
          return { month: l.getMonthInChinese() + '月', day: l.getDayInChinese() };
        } catch (e) { return null; }
      }

      // 格子內顯示：初一顯示月份（正月），其餘顯示日期（初八、十五）
      function lunarText(y, m, d) {
        var p = lunarParts(y, m, d);
        if (!p) return '';
        return p.day === '初一' ? p.month : p.day;
      }

      // 詳情顯示：正月初一
      function lunarFull(y, m, d) {
        var p = lunarParts(y, m, d);
        if (!p) return '';
        return p.month + p.day;
      }

      var HOLIDAY_SHORT = [
        ['除夕', '除夕'], ['小年夜', '小年夜'], ['春節', '春節'], ['初四', '初四'], ['端午', '端午'], ['中秋', '中秋'],
        ['國慶', '國慶'], ['元旦', '元旦'], ['清明', '清明'], ['兒童', '兒童節'],
        ['勞動', '勞動節'], ['和平', '和平日'], ['光復', '光復節'], ['教師', '教師節'],
        ['行憲', '行憲日']
      ];

      function shortHoliday(name) {
        if (!name) return '';
        for (var i = 0; i < HOLIDAY_SHORT.length; i++) {
          if (name.indexOf(HOLIDAY_SHORT[i][0]) !== -1) return HOLIDAY_SHORT[i][1];
        }
        return name.length > 2 ? name.substring(0, 2) : name;
      }

      function holidayNameFor(y, m, d) {
        // 年度資料優先（可用空字串取消固定日期，例如 2027 的 4/3 不是兒童節）
        var yk = y + '-' + (m + 1) + '-' + d;
        if (Object.prototype.hasOwnProperty.call(lunarHolidays, yk)) return lunarHolidays[yk];
        return holidays[(m + 1) + '-' + d] || '';
      }

      function dateKey(y, m, d) {
        return y + '-' + (m + 1) + '-' + d;
      }

      function renderCalendar() {
        var u = cur();
        var p1 = u.p1, p2 = u.p2;
        if (p2.pattern) {
          $('appTitle').textContent = '📅 ' + p1.name + p2.name + '輪班表';
          $('appSubtitle').textContent = p1.name + ' & ' + p2.name + '班表合併顯示，輕鬆找出共同放假的日子';
        } else {
          $('appTitle').textContent = '📅 ' + p1.name + '輪班表';
          $('appSubtitle').textContent = '可在設定中再加一位（例如家人）的班表，找出共同放假的日子';
        }
        $('monthTitle').textContent = currentYear + ' 年 ' + (currentMonth + 1) + ' 月';

        var firstDay = new Date(currentYear, currentMonth, 1).getDay();
        var daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        var daysInPrev = new Date(currentYear, currentMonth, 0).getDate();

        var today = new Date();

        var html = '';
        var day = 1;
        var nextDay = 1;

        var totalDays = daysInMonth;
        var totalCells = Math.ceil((firstDay + totalDays) / 7) * 7;

        var p1OffCount = 0, p2OffCount = 0, bothOffCount = 0, sportCount = 0;
        var act = actOf(u);

        for (var i = 0; i < totalCells; i++) {
          if (i % 7 === 0) html += '<tr>';

          var displayDay, displayMonth, displayYear, isOther;

          if (i < firstDay) {
            displayDay = daysInPrev - firstDay + i + 1;
            displayMonth = currentMonth - 1;
            displayYear = currentYear;
            if (displayMonth < 0) { displayMonth = 11; displayYear--; }
            isOther = true;
          } else if (i >= firstDay + totalDays) {
            displayDay = nextDay++;
            displayMonth = currentMonth + 1;
            displayYear = currentYear;
            if (displayMonth > 11) { displayMonth = 0; displayYear++; }
            isOther = true;
          } else {
            displayDay = day++;
            displayMonth = currentMonth;
            displayYear = currentYear;
            isOther = false;
          }

          var isToday = (displayYear === today.getFullYear() && displayMonth === today.getMonth() && displayDay === today.getDate());

          var p1Shift = effShift(u, 'p1', displayYear, displayMonth, displayDay);
          var p2Shift = effShift(u, 'p2', displayYear, displayMonth, displayDay);
          var ev1 = eventOf(u, 'p1', displayYear, displayMonth, displayDay);
          var ev2 = eventOf(u, 'p2', displayYear, displayMonth, displayDay);

          if (!isOther) {
            if (p1Shift === 'off') p1OffCount++;
            if (p2Shift === 'off') p2OffCount++;
            if (p1Shift === 'off' && p2Shift === 'off') bothOffCount++;
          }

          var cellClass = isOther ? 'other-month' : '';
          if (isToday) cellClass += ' today';
          if (!isOther && viewMode === 'both' && p1Shift === 'off' && p2Shift === 'off') cellClass += ' highlight-cell';
          if (!isOther && viewMode === 'p1' && p1Shift === 'off') cellClass += ' highlight-cell';
          if (!isOther && viewMode === 'p2' && p2Shift === 'off') cellClass += ' highlight-cell';

          var badges = '';
          var mob = isMobile();

          if (!isOther) {
            if (viewMode !== 'p2' && p1Shift) badges += personBadge(p1.name, '我', p1Shift, ev1, mob);
            if (viewMode !== 'p1' && p2Shift) badges += personBadge(p2.name, '伴', p2Shift, ev2, mob);
            var evTags = '';
            if (viewMode !== 'p2' && ev1) evTags += evTag(p1.name, '我', ev1, mob);
            if (viewMode !== 'p1' && ev2) evTags += evTag(p2.name, '伴', ev2, mob);
            badges += evTags;

            if (viewMode === 'both' && p1Shift === 'off' && p2Shift === 'off') {
              badges = '<div class="shift-badge both-off">' + (mob ? '✓ 同休' : '✓ 兩人都休假') + '</div>';
              badges += evTags;
              [[ev1, p1.name, '我'], [ev2, p2.name, '伴']].forEach(function (x) {
                if (x[0] && x[0].type === 'leave' && Number(x[0].days) >= 1) {
                  badges += '<div class="ev-tag">' + escHtml((mob ? personShort(x[1], x[2]) + LEAVE_SHORT[x[0].kind] : x[1] + ' ' + x[0].kind)) + '</div>';
                }
              });
              if (act.on) {
                if (markerOk(u, act, displayYear, displayMonth, displayDay)) {
                  badges += '<div class="sport-icon" title="' + escHtml(act.name) + '">' + escHtml(act.icon) + '</div>';
                  sportCount++;
                  cellClass += ' sport-cell';
                }
              }
            } else if (viewMode === 'p1' && p1Shift === 'off') {
              badges = '<div class="shift-badge off">' + (mob ? '✓ 休' : '✓ 休假') + '</div>' + evTags;
            } else if (viewMode === 'p2' && p2Shift === 'off') {
              badges = '<div class="shift-badge off">' + (mob ? '✓ 休' : '✓ 休假') + '</div>' + evTags;
            }
          }

          var dk = dateKey(displayYear, displayMonth, displayDay);
          var noteText = notes[dk];
          var holidayName = holidayNameFor(displayYear, displayMonth, displayDay);

          if (!isOther && holidayName) {
            cellClass += ' holiday-cell';
            var showName = mob ? shortHoliday(holidayName) : holidayName;
            badges += '<div class="holiday-icon" title="' + escHtml(holidayName) + '">' + escHtml(showName) + '</div>';
          }
          if (!isOther && noteText) {
            badges += '<div class="note-icon">📝 ' + escHtml(noteText.substring(0, mob ? 3 : 6)) + (noteText.length > (mob ? 3 : 6) ? '...' : '') + '</div>';
          }

          html += '<td class="' + cellClass + '"' + (!isOther ? ' data-date="' + dk + '"' : '') + '>';
          var lunar = lunarText(displayYear, displayMonth, displayDay);
          html += '<div class="day-row"><div class="day-num">' + displayDay + '</div>' + (lunar ? '<div class="lunar-date">' + lunar + '</div>' : '') + '</div>';
          html += badges;
          html += '</td>';

          if (i % 7 === 6) html += '</tr>';
        }

        $('calendarBody').innerHTML = html;

        var summaryHtml = '';
        if (viewMode === 'both') {
          summaryHtml =
            '<div class="summary-card"><div class="value">' + p1OffCount + '</div><div class="label">' + escHtml(p1.name) + '休假天數</div></div>' +
            '<div class="summary-card"><div class="value">' + p2OffCount + '</div><div class="label">' + escHtml(p2.name) + '休假天數</div></div>' +
            '<div class="summary-card"><div class="value" style="color:#16a34a">' + bothOffCount + '</div><div class="label">共同休假天數</div></div>' +
            (act.on ? '<div class="summary-card"><div class="value" style="color:#ea580c">' + sportCount + '</div><div class="label">' + escHtml(act.icon + ' ' + act.name) + '天數</div></div>' : '');
        } else if (viewMode === 'p1') {
          summaryHtml =
            '<div class="summary-card"><div class="value">' + p1OffCount + '</div><div class="label">' + escHtml(p1.name) + '休假天數</div></div>';
        } else {
          summaryHtml =
            '<div class="summary-card"><div class="value">' + p2OffCount + '</div><div class="label">' + escHtml(p2.name) + '休假天數</div></div>';
        }
        $('summaryBox').innerHTML = summaryHtml;
        renderLeaveCard();

        $('calendarBody').querySelectorAll('td[data-date]').forEach(function(td) {
          td.addEventListener('click', function() {
            openNoteModal(td.dataset.date);
          });
        });
      }

      function personBadge(name, fallback, shift, ev, mob) {
        var short = escHtml(personShort(name, fallback));
        if (ev && ev.type === 'leave' && Number(ev.days) >= 1 && shift === 'off') {
          return '<div class="shift-badge leave" title="' + escHtml(name + ' ' + ev.kind) + '">' +
            (mob ? short + LEAVE_SHORT[ev.kind] : escHtml(name) + ': ' + escHtml(ev.kind)) + '</div>';
        }
        if (ev && ev.type === 'ot' && ev.shift) {
          return '<div class="shift-badge ' + shift + ' ot" title="' + escHtml(name + ' 加班 ' + fmtNum(ev.hours) + ' 小時') + '">' +
            (mob ? short + '加' + shortShiftLabel(shift) : escHtml(name) + ': 加' + shiftLabel(shift)) + '</div>';
        }
        return mob
          ? '<div class="shift-badge ' + shift + '">' + short + shortShiftLabel(shift) + '</div>'
          : '<div class="shift-badge ' + shift + '">' + escHtml(name) + ': ' + shiftLabel(shift) + '</div>';
      }

      // 不改變班別的紀錄（半天假、上班日加班），以及共同休假時的請假說明
      function evTag(name, fallback, ev, mob) {
        var full = ev.type === 'leave' && Number(ev.days) >= 1;
        var shiftChanged = ev.type === 'ot' && ev.shift;
        var who = mob ? personShort(name, fallback) : name + ' ';
        var t;
        if (ev.type === 'leave') t = (full ? '' : '½') + (mob ? LEAVE_SHORT[ev.kind] : ev.kind);
        else t = '+' + fmtNum(ev.hours) + 'h';
        if (full || shiftChanged) return '';
        return '<div class="ev-tag" title="' + escHtml(name + ' ' + evText(ev, true)) + '">' + escHtml(who + t) + '</div>';
      }

      function escHtml(s) {
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }

      function openNoteModal(dk, draft) {
        var existing = notes[dk] || '';
        var parts = dk.split('-');
        var y = parseInt(parts[0]);
        var m = parseInt(parts[1]) - 1;
        var d = parseInt(parts[2]);
        var u = cur();
        var p1Shift = effShift(u, 'p1', y, m, d);
        var p2Shift = effShift(u, 'p2', y, m, d);

        var shiftInfo = escHtml(u.p1.name) + ': ' + shiftLabel(p1Shift) + ' ｜ ' + escHtml(u.p2.name) + ': ' + shiftLabel(p2Shift);
        if (p1Shift === 'off' && p2Shift === 'off') {
          shiftInfo += '  ★ 共同休假';
        }

        var lunarDay = lunarFull(y, m, d);
        if (lunarDay) {
          shiftInfo += '<br>🌙 農曆：' + lunarDay;
        }
        var holidayName = holidayNameFor(y, m, d);
        if (holidayName) {
          shiftInfo += '<br>🎉 假日：' + escHtml(holidayName);
        }

        var html = '<div class="modal-overlay" id="noteModal">' +
          '<div class="modal">' +
          '<h3>' + y + ' 年 ' + (m + 1) + ' 月 ' + d + ' 日</h3>' +
          '<div class="shift-info">' + shiftInfo + '</div>' +
          eventSectionHtml(u, y, m, d) +
          '<textarea id="noteInput" placeholder="輸入備註事項...">' + escHtml(draft !== undefined ? draft : existing) + '</textarea>' +
          '<div class="modal-btns">' +
          (existing ? '<button type="button" class="btn-delete" id="btnDelNote">刪除</button>' : '') +
          '<button type="button" id="btnCancelNote">取消</button>' +
          '<button type="button" class="btn-save" id="btnSaveNote">儲存</button>' +
          '</div>' +
          '</div>' +
          '</div>';

        $('modalContainer').innerHTML = html;

        $('btnCancelNote').addEventListener('click', closeModal);
        $('btnSaveNote').addEventListener('click', function() {
          var val = $('noteInput').value.trim();
          if (val) {
            notes[dk] = val;
          } else {
            delete notes[dk];
          }
          saveLocal();
          persistNote(currentId, dk, val);
          closeModal();
          renderCalendar();
          showToast('已儲存備註');
        });

        if ($('btnDelNote')) {
          $('btnDelNote').addEventListener('click', function() {
            delete notes[dk];
            saveLocal();
            persistNote(currentId, dk, '');
            closeModal();
            renderCalendar();
            showToast('已刪除備註');
          });
        }

        $('noteModal').addEventListener('click', function(e) {
          if (e.target === $('noteModal')) closeModal();
        });

        bindEventSection(u, dk, y, m, d);
        if (draft === undefined && !$('modalContainer').querySelector('.ev-form')) $('noteInput').focus();
      }

      function eventSectionHtml(u, y, m, d) {
        var html = '';
        ['p1', 'p2'].forEach(function (person) {
          var p = u[person];
          if (!p.pattern) return;
          if (viewMode !== 'both' && viewMode !== person) return;
          var base = baseShift(u, person, y, m, d);
          var ev = eventOf(u, person, y, m, d);
          var state = '排班：' + (shiftLabel(base) || '—');
          if (ev) state += '　→　<b>' + escHtml(evText(ev, true)) + '</b>';
          var btns = ev
            ? '<button type="button" class="ev-edit" data-person="' + person + '" data-type="' + ev.type + '">修改</button>' +
              '<button type="button" class="ev-del" data-person="' + person + '">取消' + (ev.type === 'leave' ? '請假' : '加班') + '</button>'
            : (base && base !== 'off' ? '<button type="button" class="ev-add" data-person="' + person + '" data-type="leave">請假</button>' : '') +
              '<button type="button" class="ev-add" data-person="' + person + '" data-type="ot">加班</button>';
          html += '<div class="ev-person" data-person="' + person + '">' +
            '<div class="ev-head"><b>' + escHtml(p.name || '') + '</b><div class="ev-btns">' + btns + '</div></div>' +
            '<div class="ev-state">' + state + '</div>' +
            '<div class="ev-form-slot"></div></div>';
        });
        return html;
      }

      function bindEventSection(u, dk, y, m, d) {
        var box = $('modalContainer');
        box.querySelectorAll('.ev-add, .ev-edit').forEach(function (b) {
          b.addEventListener('click', function () { showEventForm(u, dk, y, m, d, b.dataset.person, b.dataset.type); });
        });
        box.querySelectorAll('.ev-del').forEach(function (b) {
          b.addEventListener('click', function () {
            var person = b.dataset.person;
            delete u.events[evKey(person, dk)];
            saveLocal();
            persistEvent(u.id, person, dk, null);
            renderCalendar();
            openNoteModal(dk, $('noteInput').value);
            showToast('已取消');
          });
        });
      }

      function showEventForm(u, dk, y, m, d, person, type) {
        var slot = $('modalContainer').querySelector('.ev-person[data-person="' + person + '"] .ev-form-slot');
        $('modalContainer').querySelectorAll('.ev-form-slot').forEach(function (s) { s.innerHTML = ''; });
        var base = baseShift(u, person, y, m, d);
        var ev = eventOf(u, person, y, m, d);
        var cur0 = ev && ev.type === type ? ev : null;
        var html = '<div class="ev-form">';
        if (type === 'leave') {
          var kind0 = cur0 ? cur0.kind : '特休';
          var half0 = cur0 && Number(cur0.days) < 1;
          html += '<div class="ev-row">假別 <select class="ev-kind">' + LEAVE_KINDS.map(function (k) {
            return '<option' + (k === kind0 ? ' selected' : '') + '>' + k + '</option>';
          }).join('') + '</select></div>' +
            '<div class="ev-row"><label class="radio"><input type="radio" name="evDays" value="1"' + (half0 ? '' : ' checked') + '> 1 天</label>' +
            '<label class="radio"><input type="radio" name="evDays" value="0.5"' + (half0 ? ' checked' : '') + '> 半天</label></div>' +
            '<div class="ev-hint ev-left"></div>';
        } else {
          var shiftOpts = base === 'off' || !base
            ? [['day', '加日班'], ['night', '加夜班']]
            : [['', '維持原班（只記時數）']];
          var shift0 = cur0 ? cur0.shift : shiftOpts[0][0];
          var hours0 = cur0 ? cur0.hours : (base === 'off' || !base ? 12 : 2);
          html += '<div class="ev-row">班別 <select class="ev-shift">' + shiftOpts.map(function (o) {
            return '<option value="' + o[0] + '"' + (o[0] === shift0 ? ' selected' : '') + '>' + o[1] + '</option>';
          }).join('') + '</select></div>' +
            '<div class="ev-row">時數 <input type="number" class="ev-hours" min="0.5" max="24" step="0.5" value="' + hours0 + '"> 小時</div>';
        }
        html += '<div class="ev-row"><button type="button" class="ev-save">儲存</button><button type="button" class="ev-cancel">取消</button></div></div>';
        slot.innerHTML = html;

        function updateLeft() {
          var hint = slot.querySelector('.ev-left');
          if (!hint) return;
          var kind = slot.querySelector('.ev-kind').value;
          var qk = kind === '特休' ? 'annual' : kind === '彈性休' ? 'flex' : null;
          if (!qk) { hint.textContent = '此假別只記錄，不扣年度額度'; return; }
          var q = quotaOf(u, person, y)[qk];
          var used = usageOf(u, person, y, -1).leave[kind] || 0;
          if (cur0 && cur0.kind === kind) used -= Number(cur0.days);
          var want = Number(slot.querySelector('input[name="evDays"]:checked').value);
          var left = q - used - want;
          hint.textContent = y + ' 年' + kind + '共 ' + fmtNum(q) + ' 天，請完剩 ' + fmtNum(left) + ' 天' + (left < 0 ? '（超過額度）' : '');
          hint.style.color = left < 0 ? 'var(--error)' : '';
        }
        slot.querySelectorAll('select, input').forEach(function (el) { el.addEventListener('change', updateLeft); });
        updateLeft();

        slot.querySelector('.ev-cancel').addEventListener('click', function () { slot.innerHTML = ''; });
        slot.querySelector('.ev-save').addEventListener('click', function () {
          var e;
          if (type === 'leave') {
            e = { type: 'leave', kind: slot.querySelector('.ev-kind').value, days: Number(slot.querySelector('input[name="evDays"]:checked').value), shift: '', hours: 0 };
          } else {
            var h = Number(slot.querySelector('.ev-hours').value);
            if (!(h > 0)) { showToast('請輸入加班時數'); return; }
            e = { type: 'ot', kind: '', days: 0, shift: slot.querySelector('.ev-shift').value, hours: h };
          }
          if (!u.events) u.events = {};
          u.events[evKey(person, dk)] = e;
          saveLocal();
          persistEvent(u.id, person, dk, e);
          renderCalendar();
          var draft = $('noteInput').value;
          openNoteModal(dk, draft);
          showToast('已記錄' + (type === 'leave' ? '請假' : '加班'));
        });
      }

      // ===== 年度休假與加班統計 =====
      function renderLeaveCard() {
        var u = cur();
        var year = currentYear;
        var persons = ['p1', 'p2'].filter(function (k) {
          return u[k].pattern && (viewMode === 'both' || viewMode === k);
        });
        if (!persons.length) { $('leaveCard').style.display = 'none'; return; }
        $('leaveCard').style.display = '';
        var html = '<h2>📋 ' + year + ' 年度休假與加班</h2><div class="leave-grid">';
        persons.forEach(function (k) {
          var p = u[k];
          var q = quotaOf(u, k, year);
          var us = usageOf(u, k, year, currentMonth);
          var team = corningTeamOf(p);
          html += '<div class="leave-person"><h3><span class="dot ' + (k === 'p1' ? 'dot-me' : 'dot-bk') + '" style="width:10px;height:10px;border-radius:50%;display:inline-block"></span>' +
            escHtml(p.name || '') + (team ? ' <span class="team-tag">康寧 ' + team + ' 班</span>' : '') + '</h3>';
          QUOTA_KINDS.forEach(function (qk) {
            var total = q[qk[1]];
            var used = us.leave[qk[0]] || 0;
            var left = total - used;
            var pct = total > 0 ? Math.min(100, used / total * 100) : (used > 0 ? 100 : 0);
            html += '<div class="quota-row">' +
              '<div class="q-top"><span class="q-name">' + qk[0] + '</span><span>剩 <span class="q-left' + (left < 0 ? ' neg' : '') + '">' + fmtNum(left) + '</span> 天</span></div>' +
              '<div class="q-sub">已用 <b>' + fmtNum(used) + '</b> 天 ／ 共 <input type="number" min="0" max="60" step="0.5" data-person="' + k + '" data-q="' + qk[1] + '" value="' + fmtNum(total) + '"> 天</div>' +
              '<div class="quota-bar"><span style="width:' + pct + '%"></span></div></div>';
          });
          var others = LEAVE_KINDS.filter(function (kk) { return kk !== '特休' && kk !== '彈性休' && us.leave[kk]; })
            .map(function (kk) { return kk + ' ' + fmtNum(us.leave[kk]) + ' 天'; });
          html += '<div class="leave-line">其他請假：<b>' + (others.length ? others.join('、') : '無') + '</b><br>' +
            '加班：本月 <b>' + fmtNum(us.otMonth) + '</b> 小時（' + us.otMonthCount + ' 次）　全年 <b>' + fmtNum(us.otYear) + '</b> 小時（' + us.otYearCount + ' 次）</div>';
          if (us.list.length) {
            html += '<details><summary>查看 ' + year + ' 年明細（' + us.list.length + ' 筆）</summary><ul>' +
              us.list.map(function (x) { return '<li>' + x.m + '/' + x.d + '　' + escHtml(evText(x.e, true)) + '</li>'; }).join('') +
              '</ul></details>';
          }
          html += '</div>';
        });
        html += '</div><p class="help-text" style="margin-top:10px">點日曆上的日期即可登記請假或加班。' +
          '特休天數請依公司核給填寫' + (persons.some(function (k) { return corningTeamOf(u[k]); }) ? '，康寧員工另有 4 天彈性休（已預先帶入）' : '') + '。</p>';
        $('leaveCard').innerHTML = html;
        $('leaveCard').querySelectorAll('.quota-row input').forEach(function (inp) {
          inp.addEventListener('change', function () {
            var v = Number(inp.value);
            if (!(v >= 0)) { inp.value = '0'; v = 0; }
            if (!u.quota) u.quota = {};
            if (!u.quota[inp.dataset.person]) u.quota[inp.dataset.person] = {};
            var cq = quotaOf(u, inp.dataset.person, year);
            cq[inp.dataset.q] = v;
            u.quota[inp.dataset.person][String(year)] = cq;
            saveLocal();
            persistProfile(u);
            renderLeaveCard();
            showToast('已更新 ' + year + ' 年額度');
          });
        });
      }

      function closeModal() {
        $('modalContainer').innerHTML = '';
      }

      // 兩人都休假的日子，是否符合「共同休假標記」的條件
      function markerOk(u, act, y, m, d) {
        var prevP1 = effShift(u, 'p1', y, m, d - 1), prevP2 = effShift(u, 'p2', y, m, d - 1);
        var nextP1 = effShift(u, 'p1', y, m, d + 1), nextP2 = effShift(u, 'p2', y, m, d + 1);
        return !((act.p1PrevNight && prevP1 === 'night') || (act.p2PrevNight && prevP2 === 'night') ||
          (act.p1NextDay && nextP1 === 'day') || (act.p2NextDay && nextP2 === 'day'));
      }

      // ===== 找休假日 =====
      var WEEK = '日一二三四五六';
      function addDays(dt, n) { return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + n); }
      function mdw(dt) { return (dt.getMonth() + 1) + '/' + dt.getDate() + '（' + WEEK.charAt(dt.getDay()) + '）'; }

      // 回傳符合條件的連續休假區段
      function findOffRuns(u, who, from, to, minRun, markerOnly) {
        var act = actOf(u);
        var runs = [], run = null;
        for (var dt = from; dt <= to; dt = addDays(dt, 1)) {
          var y = dt.getFullYear(), m = dt.getMonth(), d = dt.getDate();
          var s1 = effShift(u, 'p1', y, m, d), s2 = effShift(u, 'p2', y, m, d);
          var ok;
          if (who === 'both') ok = s1 === 'off' && s2 === 'off' && (!markerOnly || markerOk(u, act, y, m, d));
          else ok = (who === 'p1' ? s1 : s2) === 'off';
          if (ok) {
            if (!run) { run = { start: dt, end: dt, days: [] }; runs.push(run); }
            run.end = dt;
            run.days.push(dt);
          } else {
            run = null;
          }
        }
        return runs.filter(function (r) { return r.days.length >= minRun; });
      }

      function openFinder() {
        var u = cur();
        var hasP2 = !!u.p2.pattern;
        var who0 = viewMode === 'p1' || viewMode === 'p2' ? viewMode : (hasP2 ? 'both' : 'p1');
        var today = new Date();
        var t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        var whoOpts = (hasP2 && u.p1.pattern ? '<option value="both">' + escHtml(u.p1.name + ' & ' + u.p2.name) + ' 共同休假</option>' : '') +
          (u.p1.pattern ? '<option value="p1">只看 ' + escHtml(u.p1.name) + ' 休假</option>' : '') +
          (hasP2 ? '<option value="p2">只看 ' + escHtml(u.p2.name) + ' 休假</option>' : '');
        var act = actOf(u);

        $('modalContainer').innerHTML = '<div class="modal-overlay" id="noteModal"><div class="modal finder">' +
          '<h3>🔍 找休假日</h3>' +
          '<div class="fd-row"><label class="fd-lbl">對象</label><select class="fd-who" id="fdWho">' + whoOpts + '</select></div>' +
          '<div class="fd-row"><label class="fd-lbl">區間</label><input type="date" id="fdFrom"> ～ <input type="date" id="fdTo"></div>' +
          '<div class="fd-row"><label class="fd-lbl"></label><div class="fd-chips" id="fdPresets">' +
            '<button type="button" data-p="1m">未來 1 個月</button><button type="button" data-p="3m">3 個月</button>' +
            '<button type="button" data-p="6m">半年</button><button type="button" data-p="ye">今年剩下</button><button type="button" data-p="ny">明年整年</button>' +
          '</div></div>' +
          '<div class="fd-row"><label class="fd-lbl">連休</label><div class="fd-chips" id="fdMin">' +
            [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" data-n="' + n + '">' + (n === 1 ? '不限' : '至少 ' + n + ' 天') + '</button>'; }).join('') +
          '</div></div>' +
          '<div class="fd-row" id="fdMarkerRow"><label class="fd-lbl"></label><label class="chk"><input type="checkbox" id="fdMarker"> 只看「' + escHtml(act.icon + ' ' + act.name) + '」的日子</label></div>' +
          '<div class="fd-sum" id="fdSum"></div>' +
          '<ul class="fd-list" id="fdList"></ul>' +
          '<div class="modal-btns"><button type="button" id="fdCopy">複製結果</button><button type="button" class="btn-save" id="fdClose">關閉</button></div>' +
          '</div></div>';

        var state = { minRun: 1 };
        $('fdWho').value = who0;
        function setRange(p) {
          var to;
          if (p === '1m') to = new Date(t0.getFullYear(), t0.getMonth() + 1, t0.getDate());
          else if (p === '3m') to = new Date(t0.getFullYear(), t0.getMonth() + 3, t0.getDate());
          else if (p === '6m') to = new Date(t0.getFullYear(), t0.getMonth() + 6, t0.getDate());
          else if (p === 'ye') to = new Date(t0.getFullYear(), 11, 31);
          var from = t0;
          if (p === 'ny') { from = new Date(t0.getFullYear() + 1, 0, 1); to = new Date(t0.getFullYear() + 1, 11, 31); }
          $('fdFrom').value = fmtLocal(from);
          $('fdTo').value = fmtLocal(to);
          $('fdPresets').querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b.dataset.p === p); });
          run();
        }
        var lastRuns = [], lastFrom, lastTo;
        function run() {
          var who = $('fdWho').value;
          $('fdMarkerRow').style.display = who === 'both' && act.on ? '' : 'none';
          $('fdMin').querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', Number(b.dataset.n) === state.minRun); });
          if (!$('fdFrom').value || !$('fdTo').value) return;
          var from = parseDate($('fdFrom').value), to = parseDate($('fdTo').value);
          if (to < from) { var tmp = from; from = to; to = tmp; }
          var maxTo = new Date(from.getFullYear() + 2, from.getMonth(), from.getDate());
          if (to > maxTo) to = maxTo; // 最多查兩年
          var runs = findOffRuns(u, who, from, to, state.minRun, who === 'both' && act.on && $('fdMarker').checked);
          lastRuns = runs; lastFrom = from; lastTo = to;
          var total = runs.reduce(function (s, r) { return s + r.days.length; }, 0);
          $('fdSum').textContent = runs.length
            ? '共 ' + total + ' 天，' + runs.length + ' 段' + (state.minRun > 1 ? '（連休 ' + state.minRun + ' 天以上）' : '')
            : '';
          if (!runs.length) {
            $('fdList').innerHTML = '<li class="fd-empty">這段期間沒有符合條件的休假日</li>';
            return;
          }
          $('fdList').innerHTML = runs.map(function (r, i) {
            var label = r.days.length === 1 ? mdw(r.start) : mdw(r.start) + ' ～ ' + mdw(r.end);
            if (r.start.getFullYear() !== t0.getFullYear() || r.end.getFullYear() !== r.start.getFullYear()) label = r.start.getFullYear() + '/' + label;
            var subs = [];
            r.days.forEach(function (dt) {
              var hn = holidayNameFor(dt.getFullYear(), dt.getMonth(), dt.getDate());
              if (hn) subs.push('🎉 ' + (dt.getMonth() + 1) + '/' + dt.getDate() + ' ' + hn);
              var nt = (u.notes || {})[dateKey(dt.getFullYear(), dt.getMonth(), dt.getDate())];
              if (nt) subs.push('📝 ' + (dt.getMonth() + 1) + '/' + dt.getDate() + ' ' + (nt.length > 12 ? nt.slice(0, 12) + '…' : nt));
              ['p1', 'p2'].forEach(function (k) {
                var e = eventOf(u, k, dt.getFullYear(), dt.getMonth(), dt.getDate());
                if (e && e.type === 'leave') subs.push('🗓️ ' + (dt.getMonth() + 1) + '/' + dt.getDate() + ' ' + u[k].name + e.kind);
              });
            });
            var marks = '';
            if (who === 'both' && act.on && !$('fdMarker').checked) {
              var n = r.days.filter(function (dt) { return markerOk(u, act, dt.getFullYear(), dt.getMonth(), dt.getDate()); }).length;
              if (n) marks = ' ' + act.icon + (n > 1 ? '×' + n : '');
            }
            return '<li data-i="' + i + '">' + escHtml(label) + '<span class="fd-days">' + r.days.length + ' 天</span>' + escHtml(marks) +
              (subs.length ? '<div class="fd-sub">' + escHtml(subs.join('　')) + '</div>' : '') + '</li>';
          }).join('');
          $('fdList').querySelectorAll('li[data-i]').forEach(function (li) {
            li.addEventListener('click', function () {
              var r = lastRuns[Number(li.dataset.i)];
              currentYear = r.start.getFullYear();
              currentMonth = r.start.getMonth();
              closeModal();
              renderCalendar();
              document.querySelector('.calendar').scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
          });
        }

        $('fdPresets').querySelectorAll('button').forEach(function (b) { b.addEventListener('click', function () { setRange(b.dataset.p); }); });
        $('fdMin').querySelectorAll('button').forEach(function (b) {
          b.addEventListener('click', function () { state.minRun = Number(b.dataset.n); run(); });
        });
        ['fdWho', 'fdFrom', 'fdTo', 'fdMarker'].forEach(function (id) {
          $(id).addEventListener('change', function () {
            if (id === 'fdFrom' || id === 'fdTo') $('fdPresets').querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
            run();
          });
        });
        $('fdClose').addEventListener('click', closeModal);
        $('fdCopy').addEventListener('click', function () {
          copyText(buildShareText())
            .then(function () { showToast('已複製，可以貼到 LINE'); }, function () { showToast('複製失敗'); });
        });

        // 貼到 LINE 的文字：月份分組＋圖示
        var MONTH_ICON = ['🎍', '🧧', '🌸', '🌷', '🌿', '🌊', '🍉', '🌻', '🎑', '🍁', '🍂', '🎄'];
        function runIcon(n) { return n >= 3 ? '🏖️' : n === 2 ? '🌴' : '☀️'; }
        function buildShareText() {
          var who = $('fdWho').value;
          var markerOnly = who === 'both' && act.on && $('fdMarker').checked;
          var SEP = '━━━━━━━━━━━━';
          var out = [];
          out.push(who === 'both'
            ? '💑 ' + u.p1.name + ' & ' + u.p2.name + '｜共同休假'
            : '🙋 ' + u[who].name + '｜休假日');
          out.push('🗓️ ' + fmtLocal(lastFrom).replace(/-/g, '/') + ' ～ ' + fmtLocal(lastTo).replace(/-/g, '/'));
          if (state.minRun > 1) out.push('🔎 連休 ' + state.minRun + ' 天以上');
          if (markerOnly) out.push('🔎 只看' + act.icon + act.name + '的日子');
          out.push(SEP);
          if (!lastRuns.length) {
            out.push('😢 這段期間沒有符合條件的休假日');
          } else {
            var curKey = '';
            lastRuns.forEach(function (r) {
              var key = r.start.getFullYear() + '-' + r.start.getMonth();
              if (key !== curKey) {
                if (curKey) out.push('');
                curKey = key;
                var showYear = r.start.getFullYear() !== lastFrom.getFullYear() || lastTo.getFullYear() !== lastFrom.getFullYear();
                out.push(MONTH_ICON[r.start.getMonth()] + ' ' + (showYear ? r.start.getFullYear() + ' 年 ' : '') + (r.start.getMonth() + 1) + ' 月');
              }
              var n = r.days.length;
              var mk = '';
              if (who === 'both' && act.on) {
                var k = r.days.filter(function (dt) { return markerOk(u, act, dt.getFullYear(), dt.getMonth(), dt.getDate()); }).length;
                if (k) mk = ' ' + act.icon + (k > 1 && k < n ? '×' + k : '');
              }
              out.push(runIcon(n) + ' ' + (n === 1 ? mdw(r.start) : mdw(r.start) + '～' + mdw(r.end)) + '｜' + n + ' 天' + mk);
              r.days.forEach(function (dt) {
                var y = dt.getFullYear(), m = dt.getMonth(), d = dt.getDate(), md = (m + 1) + '/' + d;
                var hn = holidayNameFor(y, m, d);
                if (hn) out.push('　　🎉 ' + md + ' ' + hn);
                ['p1', 'p2'].forEach(function (pk) {
                  var e = eventOf(u, pk, y, m, d);
                  if (e && e.type === 'leave' && (who === 'both' || who === pk)) out.push('　　🗓️ ' + md + ' ' + u[pk].name + '請' + e.kind);
                });
                var nt = (u.notes || {})[dateKey(y, m, d)];
                if (nt) out.push('　　📝 ' + md + ' ' + nt.replace(/\s+/g, ' '));
              });
            });
            out.push(SEP);
            var total = lastRuns.reduce(function (s, r) { return s + r.days.length; }, 0);
            var longest = lastRuns.reduce(function (mx, r) { return Math.max(mx, r.days.length); }, 0);
            out.push('✅ 共 ' + total + ' 天・' + lastRuns.length + ' 段' + (longest > 1 ? '・最長連休 ' + longest + ' 天' : ''));
            if (who === 'both' && act.on && !markerOnly) {
              var mt = 0;
              lastRuns.forEach(function (r) {
                mt += r.days.filter(function (dt) { return markerOk(u, act, dt.getFullYear(), dt.getMonth(), dt.getDate()); }).length;
              });
              if (mt) out.push(act.icon + ' 適合' + act.name + ' ' + mt + ' 天');
            }
          }
          out.push('📅 來自「輪班班表」');
          return out.join('\n');
        }
        $('noteModal').addEventListener('click', function (e) { if (e.target === $('noteModal')) closeModal(); });
        setRange('3m');
      }

      function openJumpModal() {
        var years = '';
        for (var y = currentYear - 10; y <= currentYear + 10; y++) {
          years += '<option value="' + y + '"' + (y === currentYear ? ' selected' : '') + '>' + y + ' 年</option>';
        }
        var months = '';

        }

          '<select id="jumpMonth">' + months + '</select></div>' +
          '<div class="modal-btns">' +

          '</div>' +
          '</div>';

      function setIfIdle(id, val) {
        var el = $(id);
        if (!el) return;
        if (document.activeElement === el) return; // 使用者正在輸入，不覆寫
        if (el.value !== val) el.value = val;
      }

      function loadForm() {
        var u = cur();
        setIfIdle('p1Name', u.p1.name || '');
        setIfIdle('myPattern', u.p1.pattern || '');
        setIfIdle('myStartDate', u.p1.startDate || '');
        setIfIdle('p2Name', u.p2.name || '');
        setIfIdle('bkPattern', u.p2.pattern || '');
        setIfIdle('bkStartDate', u.p2.startDate || '');
        var t1 = corningTeamOf(u.p1), t2 = corningTeamOf(u.p2);
        $('p1Heading').innerHTML = '<span class="dot dot-me"></span>' + escHtml(u.p1.name || '') + '班表' + (t1 ? ' <span class="team-tag">康寧 ' + t1 + ' 班</span>' : '');
        $('p2Heading').innerHTML = '<span class="dot dot-bk"></span>' + escHtml(u.p2.name || '') + '班表' + (t2 ? ' <span class="team-tag">康寧 ' + t2 + ' 班</span>' : '');
        document.querySelectorAll('.team-row').forEach(function(row) {

        });

        setIfIdle('actName', a.name);
        $('actP1Prev').checked = a.p1PrevNight;
        $('actP2Prev').checked = a.p2PrevNight;
        $('actP1Next').checked = a.p1NextDay;
        $('actP2Next').checked = a.p2NextDay;
        $('actHeadIcon').textContent = a.icon;
        document.querySelectorAll('.nm1').forEach(function(el) { el.textContent = u.p1.name || '我'; });
        document.querySelectorAll('.nm2').forEach(function(el) { el.textContent = u.p2.name || '伴侶'; });
        $('legendAct').style.display = a.on ? '' : 'none';
        $('legendActIcon').textContent = a.icon;
        $('legendActName').textContent = '適合' + a.name;
      }

      $('actIconPicks').querySelectorAll('button').forEach(function(b) {
        b.addEventListener('click', function() {
          $('actIcon').value = b.textContent;
          $('actHeadIcon').textContent = b.textContent;

      $('btnApply').addEventListener('click', applySettings);

      $('btnTogglePattern').addEventListener('click', function() {

        fields.forEach(function(f) { f.classList.toggle('hidden', !anyHidden); });
        this.textContent = anyHidden ? '⚙️ 隱藏輪班規則' : '⚙️ 顯示輪班規則';
      });

      $('btnPrev').addEventListener('click', function() {
        currentMonth--;
        if (currentMonth < 0) { currentMonth = 11; currentYear--; }
        renderCalendar();
      });

      $('btnNext').addEventListener('click', function() {
        currentMonth++;
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        renderCalendar();
      });

      $('btnToday').addEventListener('click', function() {
        var now = new Date();
        currentYear = now.getFullYear();
        currentMonth = now.getMonth();
        renderCalendar();
      });

      $('monthTitle').title = '點選可直接選擇年月';

      $('btnFinder').addEventListener('click', openFinder);

      // 跨過手機／平板與桌機寬度時重畫（切換長短標籤）
      var lastMobile = isMobile();
      window.addEventListener('resize', function() {
        if (isMobile() !== lastMobile) { lastMobile = isMobile(); renderCalendar(); }
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft') {
          $('btnPrev').click();
        } else if (e.key === 'ArrowRight') {
          $('btnNext').click();
        }
      });

      // 手機左右滑動切換月份
      var touchStartX = 0;
      var touchStartY = 0;
      var touchMoved = false;
      document.querySelector('.calendar').addEventListener('touchstart', function(e) {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
        touchMoved = false;
      }, { passive: true });
      document.querySelector('.calendar').addEventListener('touchmove', function(e) {
        var dx = e.changedTouches[0].screenX - touchStartX;
        var dy = e.changedTouches[0].screenY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
          touchMoved = true;
        }
      }, { passive: true });
      document.querySelector('.calendar').addEventListener('touchend', function(e) {
        if (!touchMoved) return;
        var dx = e.changedTouches[0].screenX - touchStartX;
        if (Math.abs(dx) > 50) {
          if (dx < 0) {
            $('btnNext').click();
          } else {
            $('btnPrev').click();
          }
        }
        touchMoved = false;
      }, { passive: true });
