      function openDialog(opts) {
        var btns = (opts.buttons || []).map(function(b, i) {
          return '<button type="button" class="' + (b.cls || '') + '" data-i="' + i + '">' + escHtml(b.label) + '</button>';
        }).join('');
        $('modalContainer').innerHTML = '<div class="modal-overlay" id="noteModal"><div class="modal">' +
          '<h3>' + escHtml(opts.title) + '</h3>' + (opts.html || '') +
          '<div class="modal-btns">' + btns + '</div></div></div>';
        $('modalContainer').querySelectorAll('.modal-btns button').forEach(function(el) {
          el.addEventListener('click', function() {

            '<div class="help-text">新增的使用者只會出現在你這個班表空間裡，其他人看不到。<br>同事請讓他們用自己的手機開網址，會自動有自己獨立的班表。</div>',
          buttons: [
            { label: '取消' },
            { label: '新增', cls: 'btn-save', onClick: function() {

        });

      $('btnRenameUser').addEventListener('click', function() {
        var u = cur();
        openDialog({
          title: '改名',
          html: '<div class="field"><label>使用者名稱</label><input type="text" class="name-input" id="dlgName" maxlength="20" value="' + escHtml(u.name) + '"></div>',
          buttons: [
            { label: '取消' },
            { label: '儲存', cls: 'btn-save', onClick: function() {
              var name = $('dlgName').value.trim();
              if (!name) { showToast('名稱不可空白'); return false; }
              if (nameTaken(name, u.id)) { showToast('此名稱已存在'); return false; }
              u.name = name;
              saveLocal();
              persistProfile(u);
              renderUserBar();
              showToast('已改名');
            } }
          ]
        });
      });

      $('btnDelUser').addEventListener('click', function() {
        if (profiles.length <= 1) { showToast('至少保留一位使用者'); return; }
        var u = cur();
        openDialog({
          title: '刪除使用者',
          html: '<p class="help-text" style="font-size:14px">確定刪除「' + escHtml(u.name) + '」？<br>這位使用者的輪班規則與備註會從雲端一起刪除，無法復原。</p>',
          buttons: [
            { label: '取消' },
            { label: '刪除', cls: 'btn-delete', onClick: function() {
              profiles = profiles.filter(function(p) { return p.id !== u.id; });
              delete viewPrefs[u.id];
              currentId = null;
              ensureCurrent();
              saveLocal();
              removeProfileCloud(u.id);
              refreshUI();
              showToast('已刪除');
            } }
          ]
        });
      });

      // ===== 班表空間：分享 / 換裝置 =====
      function wsLink(id) {
        return location.origin + location.pathname + '#ws=' + id;
      }

      function extractWs(text) {
        text = String(text || '').trim();
        var m = text.match(/ws=([0-9a-f]{32,128})/i) || text.match(/^([0-9a-f]{32,128})$/i);
        return m ? m[1].toLowerCase() : null;
      }

      function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          return navigator.clipboard.writeText(text);
        }
        var ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        return Promise.resolve();
      }

      function switchWorkspace(id, msg) {
        if (id === wsId) { showToast('已經是這個班表了'); return; }
        loadWorkspace(id);
        refreshUI();
        refreshQuiet();
        if (msg) showToast(msg);
      }

      $('btnShare').addEventListener('click', function() {
        var link = wsLink(wsId);
        openDialog({
          title: '🔗 我的班表連結',
          html:
            '<p class="help-text" style="font-size:13px;margin-bottom:10px">這個班表只有拿到這條連結的人才看得到。<br>' +
            '・<b>換手機／清除瀏覽器資料</b>時，用它找回你的班表，請先存起來（例如傳給自己的 LINE）。<br>' +
            '・想讓<b>家人一起看、一起改</b>，就把連結傳給他們。<br>' +
            '・<b>同事不要給這條</b>，請他們自己開網址，會自動建立自己的班表。</p>' +
            '<div class="jump-row"><input type="text" class="share-input" id="dlgLink" readonly value="' + escHtml(link) + '"></div>' +
            '<div class="jump-row"><button type="button" class="btn-user-add" id="dlgCopy" style="flex:1">複製連結</button>' +
            (navigator.share ? '<button type="button" class="btn-user-add" id="dlgNativeShare" style="flex:1">分享…</button>' : '') + '</div>' +
            '<hr class="dlg-sep">' +
            '<div class="field"><label>已經有班表連結？貼上後按「切換」</label>' +
            '<div class="jump-row"><input type="text" class="share-input" id="dlgJoin" placeholder="貼上連結">' +
            '<button type="button" class="btn-user-add" id="dlgJoinBtn">切換</button></div></div>' +
            '<button type="button" class="btn-link-danger" id="dlgNewWs">改用一個全新的空白班表</button>',
          buttons: [{ label: '關閉' }]
        });
        $('dlgLink').addEventListener('focus', function() { this.select(); });
        $('dlgCopy').addEventListener('click', function() {
          copyText(link).then(function() { showToast('已複製連結'); }, function() { $('dlgLink').select(); showToast('請手動複製'); });
        });
        if ($('dlgNativeShare')) {
          $('dlgNativeShare').addEventListener('click', function() {
            navigator.share({ title: '輪班班表', url: link }).catch(function() {});
          });
        }
        $('dlgJoinBtn').addEventListener('click', function() {
          var id = extractWs($('dlgJoin').value);
          if (!id) { showToast('連結格式不正確'); return; }
          closeModal();
          switchWorkspace(id, '已切換班表');
        });
        $('dlgNewWs').addEventListener('click', function() {
          var oldLink = link;
          openDialog({
            title: '建立全新的空白班表？',
            html: '<p class="help-text" style="font-size:14px">這台裝置會改用新的空白班表。<br>目前的班表不會被刪除，但之後只能用原本的連結找回：</p>' +
              '<div class="jump-row"><input type="text" class="share-input" readonly value="' + escHtml(oldLink) + '"></div>',
            buttons: [
              { label: '取消' },
              { label: '建立新班表', cls: 'btn-delete', onClick: function() {
                copyText(oldLink).catch(function() {});
                switchWorkspace(randomHex(24));
                showPatternFields(true);
                showToast('已建立新班表（舊連結已複製）');
              } }
            ]
          });
        });
      });

      function welcome() {
        openDialog({
          title: '👋 歡迎使用輪班班表',
          sticky: true,
          html: '<p class="help-text" style="font-size:14px;margin-bottom:12px">這是<b>你自己的</b>班表，別人看不到你的，你也看不到別人的。</p>' +
            '<div class="field"><label>你的名字</label><input type="text" class="name-input" id="dlgName" maxlength="20" placeholder="例如：小明"></div>' +
            teamSelectHtml('dlgTeam', '') +
            '<p class="help-text">之後可以按「＋ 新增」加家人或朋友，並記得按「🔗 連結」把班表連結存起來，換手機時才找得回來。' +
            '<br>第一次用？可以先看 <a href="./help.html" target="_blank" rel="noopener">📖 使用說明</a>。</p>',
          buttons: [{ label: '開始使用', cls: 'btn-save', onClick: function() {
            var name = $('dlgName').value.trim();
            if (!name) { showToast('請輸入名字'); return false; }
            var team = $('dlgTeam').value;
            var u = cur();
            u.name = name;
            u.p1.name = name;
            if (CORNING_TEAMS[team]) { u.p1.pattern = CORNING_PATTERN; u.p1.startDate = CORNING_TEAMS[team]; }
            saveLocal();
            persistProfile(u);
            refreshUI();
            if (!CORNING_TEAMS[team]) showPatternFields(true);
            showToast(CORNING_TEAMS[team] ? '已設定為康寧 ' + team + ' 班' : '請在下方填寫輪班規則');
          } }]
        });
      }

      function hashWs() {
        var m = location.hash.match(/ws=([0-9a-f]{32,128})/i);
        return m ? m[1].toLowerCase() : null;
      }

      function clearHash() {
        try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
      }

      // 收到 #ws= 連結時：若這台裝置已在用別的班表，先詢問
      function handleIncomingWs(id) {
        clearHash();
        if (!id || id === wsId) return;
        var hasData = profiles.some(function(p) { return p.p1.pattern || p.p2.pattern || Object.keys(p.notes || {}).length; });
        if (unsavedDefault || !hasData) { switchWorkspace(id, '已開啟班表'); return; }
        var oldLink = wsLink(wsId);
        openDialog({
          title: '要切換到這個班表嗎？',
          html: '<p class="help-text" style="font-size:14px">你開啟了另一個班表的連結。<br>切換後，目前的班表只能用原本的連結找回（按「切換」會自動複製舊連結）：</p>' +
            '<div class="jump-row"><input type="text" class="share-input" readonly value="' + escHtml(oldLink) + '"></div>',
          sticky: true,
          buttons: [
            { label: '留在目前班表' },
            { label: '切換', cls: 'btn-save', onClick: function() {
              copyText(oldLink).catch(function() {});
              switchWorkspace(id, '已切換班表（舊連結已複製）');
            } }
          ]
        });
      }

      window.addEventListener('hashchange', function() {
        var id = hashWs();
        if (id) handleIncomingWs(id);
      });

      // ===== 啟動 =====
      var incoming = hashWs();
      var storedWs = lsGet(WS_KEY);
      if (!isWsId(storedWs)) storedWs = null;
      var firstRun = !storedWs && !incoming;
      if (storedWs) {
        loadWorkspace(storedWs);
      } else if (incoming) {
        loadWorkspace(incoming);
        clearHash();
        incoming = null;
      } else {
        loadWorkspace(randomHex(24));
      }

      refreshUI();
      startSync();
      if (incoming) handleIncomingWs(incoming);
      else if (firstRun) welcome();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
      }
    })();
  </script>
</body>
</html>
