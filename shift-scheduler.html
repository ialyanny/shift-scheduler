<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3b82f6">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>輪班班表</title>
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #1d4ed8;
      --primary-light: #dbeafe;
      --bg: #eef2f7;
      --bg-gradient-1: #eef2ff;
      --bg-gradient-2: #fdf2f8;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --error: #dc2626;
      --green: #16a34a;
      --green-light: #dcfce7;
      --orange: #ea580c;
      --purple: #8b5cf6;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.08), 0 2px 6px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.14), 0 4px 12px rgba(15, 23, 42, 0.08);
      --radius: 14px;
      --radius-sm: 10px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif;
      background: linear-gradient(160deg, var(--bg-gradient-1) 0%, var(--bg) 45%, var(--bg-gradient-2) 100%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 48px;
      line-height: 1.6;
    }
    .container { max-width: 1000px; margin: 0 auto; }

    header {
      text-align: center;
      margin-bottom: 24px;
      padding: 12px 0;
    }
    h1 {
      font-size: 30px;
      letter-spacing: 1px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--purple) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      display: inline-block;
    }
    .subtitle { font-size: 14px; color: var(--muted); }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-md);
      margin-bottom: 20px;
      border: 1px solid rgba(226, 232, 240, 0.6);
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .person-settings {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 18px;
      background: #fafbfd;
      transition: var(--transition);
    }
    .person-settings:hover { border-color: #c7d2fe; box-shadow: var(--shadow-sm); }
    .person-settings h3 {
      font-size: 16px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }
    .person-settings h3 .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
    }
    .person-settings h3 .dot-me { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .person-settings h3 .dot-bk { background: linear-gradient(135deg, #a78bfa, #7c3aed); }

    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--muted);
    }
    .field input, .field select {
      width: 100%;
      padding: 11px 14px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input:focus, .field select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .field input[type="text"] {
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    .field input.name-input {
      font-family: inherit;
      letter-spacing: 0;
    }

    .user-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .user-bar label {
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }
    .user-bar select {
      flex: 1;
      min-width: 120px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      background: #fff;
      color: var(--text);
    }
    .user-bar select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .btn-user-add, .btn-user-del {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }
    .btn-user-add {
      background: var(--primary);
      color: #fff;
      border: 1px solid var(--primary);
    }
    .btn-user-add:hover { background: var(--primary-dark); }
    .btn-user-del {
      background: #fff;
      color: var(--error);
      border: 1px solid #fecaca;
    }
    .btn-user-del:hover { background: #fef2f2; }
    .hidden { display: none !important; }

    .privacy-box {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      background: #fafbfd;
      margin-bottom: 16px;
    }
    .privacy-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 6px 0;
      font-size: 14px;
    }
    .privacy-row + .privacy-row { border-top: 1px dashed var(--border); }
    .privacy-row .grow { flex: 1; min-width: 140px; }
    .privacy-row .hint { font-size: 12px; color: var(--muted); flex-basis: 100%; }
    .switch { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; cursor: pointer;
      background: #cbd5e1; border-radius: 24px; transition: var(--transition);
    }
    .slider:before {
      position: absolute; content: ""; height: 18px; width: 18px;
      left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: var(--transition);
    }
    .switch input:checked + .slider { background: var(--primary); }
    .switch input:checked + .slider:before { transform: translateX(20px); }
    .btn-small {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text);
      white-space: nowrap;
    }
    .btn-small:hover { border-color: var(--primary); color: var(--primary); }
    .btn-small.danger { color: var(--error); border-color: #fecaca; }
    .btn-small.danger:hover { background: #fef2f2; }

    .member-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      font-size: 13px;
    }
    .member-label { font-weight: 700; color: var(--muted); white-space: nowrap; }
    .member-chip {
      padding: 7px 13px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: #f1f5f9;
      border: 1px solid var(--border);
      color: var(--text);
      transition: var(--transition);
    }
    .member-chip:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .member-empty { color: var(--muted); font-size: 12px; }

    .view-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background: linear-gradient(135deg, #e0e7ff, #ede9fe);
      border: 1px solid #c7d2fe;
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .view-banner .grow { flex: 1; min-width: 160px; }

    .legend {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
      font-size: 13px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
    }
    .legend-box {
      width: 22px;
      height: 15px;
      border-radius: 4px;
      display: inline-block;
    }
    .legend-box.day { background: linear-gradient(135deg, #3b82f6, #2563eb); }
    .legend-box.night { background: linear-gradient(135deg, #374151, #111827); }
    .legend-box.off { background: #fce7f3; border: 1px solid #f9a8d4; }
    .legend-box.both-off { background: #d1fae5; border: 1px solid #6ee7b7; }

    .view-toggle {
      display: flex;
      gap: 4px;
      background: #f1f5f9;
      border-radius: var(--radius-sm);
      padding: 5px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
    }
    .view-toggle button {
      flex: 1;
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: var(--muted);
      transition: var(--transition);
    }
    .view-toggle button.active {
      background: #fff;
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .view-toggle button:hover:not(.active) {
      color: var(--text);
      background: rgba(255,255,255,0.6);
    }

    .month-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    .month-nav h2 {
      font-size: 24px;
      font-weight: 700;
      min-width: 170px;
      text-align: center;
      color: var(--text);
      letter-spacing: 1px;
      cursor: pointer;
    }
    .month-nav h2:hover { color: var(--primary); }
    .nav-btn {
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      font-size: 20px;
      cursor: pointer;
      transition: var(--transition);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-btn:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary-dark);
      transform: scale(1.05);
    }
    .nav-btn:active { transform: scale(0.95); }
    .btn-today {
      padding: 9px 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: var(--primary);
      transition: var(--transition);
    }
    .btn-today:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .calendar {
      width: 100%;
      border-collapse: separate;
      border-spacing: 3px;
      font-size: 13px;
    }
    .calendar th {
      padding: 10px 4px;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }
    .calendar th:first-child,
    .calendar th:last-child { color: #f43f5e; }

    .calendar td {
      padding: 8px 6px;
      text-align: center;
      vertical-align: top;
      height: 100px;
      border: 1px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      background: #fff;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }
    .calendar td:hover:not(.other-month) {
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
      z-index: 1;
    }
    .calendar td.other-month {
      background: transparent;
      color: #cbd5e1;
      cursor: default;
      box-shadow: none;
    }
    .calendar td.other-month .day-num { opacity: 0.4; }
    .calendar td.today { box-shadow: inset 0 0 0 2px var(--primary); }

    .day-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-bottom: 4px;
    }
    .day-num {
      display: block;
      text-align: center;
      width: 24px;
      height: 24px;
      line-height: 24px;
      font-size: 13px;
      font-weight: 700;
      color: #475569;
      background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
      border-radius: 50%;
      margin: 0;
      flex-shrink: 0;
    }
    .lunar-date {
      font-size: 10px;
      font-weight: 600;
      color: #b45309;
      white-space: nowrap;
      line-height: 1.2;
    }
    .calendar td.other-month .lunar-date { opacity: 0.4; }
    .calendar td.today .day-num {
      color: #dc2626;
      background: #fee2e2;
      box-shadow: 0 0 0 2px #ef4444;
    }
    .calendar td.other-month .day-num { color: #94a3b8; background: #f1f5f9; }

    .shift-badge {
      display: block;
      width: fit-content;
      margin: 2px auto;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }
    .shift-badge.day { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; }
    .shift-badge.night { background: linear-gradient(135deg, #374151, #111827); color: #fff; }
    .shift-badge.off { background: #fce7f3; color: #e11d48; }
    .shift-badge.both-off {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      font-weight: 700;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 2px 6px rgba(5, 150, 105, 0.3);
    }

    .sport-icon {
      font-size: 13px;
      margin: 2px auto 0;
      display: block;
      width: fit-content;
      filter: sepia(1) saturate(5) hue-rotate(-20deg);
    }

    .highlight-cell {
      background: linear-gradient(135deg, #ecfdf5, #d1fae5) !important;
      box-shadow: inset 0 0 0 1.5px #6ee7b7 !important;
    }

    .sport-cell {
      background: linear-gradient(135deg, #fff7ed, #ffedd5) !important;
      box-shadow: inset 0 0 0 1.5px #fb923c !important;
    }

    .note-icon {
      font-size: 10px;
      color: #2563eb;
      margin: 2px auto 0;
      display: block;
      width: fit-content;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .holiday-icon {
      font-size: 10px;
      color: #e11d48;
      margin: 2px auto 0;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      background: #fff5f5;
      padding: 1px 6px;
      border-radius: 8px;
      border: 1px solid #fecaca;
      display: block;
      width: fit-content;
      line-height: 1.5;
    }

    .holiday-cell {
      background: linear-gradient(160deg, #fff5f5, #ffe4e6) !important;
      border-color: #fecaca !important;
    }

    .btn-apply {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
      transition: var(--transition);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .btn-apply:hover {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
      transform: translateY(-1px);
    }
    .btn-apply:active { transform: translateY(0); }

    .btn-toggle {
      display: block;
      width: 100%;
      padding: 10px;
      margin-top: 12px;
      background: #fff;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-toggle:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .pattern-field.hidden { display: none; }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e293b;
      color: #fff;
      padding: 13px 28px;
      border-radius: 12px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 100;
      box-shadow: var(--shadow-lg);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-top: 20px;
    }
    .summary-card {
      background: linear-gradient(160deg, #ffffff, #f8fafc);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 14px;
      text-align: center;
      transition: var(--transition);
    }
    .summary-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: #c7d2fe;
    }
    .summary-card .value {
      font-size: 30px;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.2;
    }
    .summary-card .label {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
      font-weight: 500;
    }

    .help-text {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.5;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .modal {
      background: #fff;
      border-radius: 16px;
      padding: 26px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal h3 {
      font-size: 18px;
      margin-bottom: 14px;
      color: var(--text);
    }
    .modal .shift-info {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
      padding: 10px 14px;
      background: #f8fafc;
      border-radius: 8px;
      border-left: 3px solid var(--primary);
    }
    .modal textarea {
      width: 100%;
      height: 110px;
      padding: 12px 14px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      resize: vertical;
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .modal textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .modal select {
      width: 100%;
      padding: 11px 14px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      background: #fff;
      font-family: inherit;
      color: var(--text);
    }
    .modal select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .jump-row {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
    }
    .ask-input {
      width: 100%;
      padding: 11px 14px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      background: #fff;
      font-family: inherit;
      color: var(--text);
      margin-bottom: 8px;
    }
    .ask-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .modal-btns {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      justify-content: flex-end;
    }
    .modal-btns button {
      padding: 9px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      transition: var(--transition);
    }
    .modal-btns button:hover { background: #f8fafc; }
    .modal-btns .btn-save {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .modal-btns .btn-save:hover { background: var(--primary-dark); }
    .modal-btns .btn-delete {
      color: var(--error);
      border-color: #fecaca;
    }
    .modal-btns .btn-delete:hover { background: #fef2f2; }

    @media (max-width: 640px) {
      body { padding: 16px 8px 40px; }
      .card { padding: 18px; }
      .container { max-width: 100%; }

      // 密碼只存在使用者腦中/記憶體，雲端只存 ENC1. 開頭的密文。
      function cryptoOK() {

      function bufToB64(buf) {
        var bytes = new Uint8Array(buf);
        var s = '';
        for (var i = 0; i < bytes.length; i += 0x8000) {

        }
        return btoa(s);

      function b64ToBuf(b64) {
        var s = atob(b64);
        var bytes = new Uint8Array(s.length);
        for (var i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i);
        return bytes;

      function deriveKey(password, salt) {
        var enc = new TextEncoder();
        return crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey'])

              { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
              base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);

        var salt = crypto.getRandomValues(new Uint8Array(16));
        var iv = crypto.getRandomValues(new Uint8Array(12));
        var data = new TextEncoder().encode(JSON.stringify(obj));
        return deriveKey(password, salt).then(function(key) {
          return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, data);
        }).then(function(ct) {
          return 'ENC1.' + bufToB64(salt) + '.' + bufToB64(iv) + '.' + bufToB64(ct);

        var parts = String(str).split('.');
        if (parts[0] !== 'ENC1' || parts.length !== 4) return Promise.reject(new Error('bad format'));

        try {
          salt = b64ToBuf(parts[1]); iv = b64ToBuf(parts[2]); ct = b64ToBuf(parts[3]);

        return deriveKey(password, salt).then(function(key) {
          return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
        }).then(function(pt) {

            bk: r[1] ? { p: r[1].p || '', s: r[1].s || '' } : null,

            decryptOwner(myEnc, key).then(function (plain) {
              if (!plain) {
                // 密碼可能已在別處更改：清除 session，下次重問
                delete sessionKeys[currentUser];
                unlockPrompted[currentUser] = false;
                u.encRows = myEnc;
                finishApply(u, before);
                return;
              }
              if (plain.me) { u.p1.pattern = plain.me.p; if (plain.me.s) u.p1.startDate = plain.me.s; }
              if (plain.bk) { u.p2.pattern = plain.bk.p; if (plain.bk.s) u.p2.startDate = plain.bk.s; }
              if (plain.meta) { if (plain.meta.a) u.p1.name = plain.meta.a; if (plain.meta.b) u.p2.name = plain.meta.b; }
              u.notes = plain.notes;
              u.encRows = myEnc;
              finishApply(u, before);
            });
          } else {
            // 沒密碼：只快取密文，絕不碰本機明文
            u.encRows = myEnc;
            saveUsers();
            renderMembers();
            renderPrivacy();
            if (!unlockPrompted[currentUser] && hasAnyEnc(myEnc)) {
              unlockPrompted[currentUser] = true;
              promptUnlockSelf();
            }
          }
          return;
        }

        // 明文路徑（跳過任何密文，絕不顯示亂碼）
        if (cfg.me && cfg.me.pattern && !isEnc(cfg.me.pattern)) { u.p1.pattern = cfg.me.pattern; if (cfg.me.start_date) u.p1.startDate = cfg.me.start_date; }
        if (cfg.bk && cfg.bk.pattern && !isEnc(cfg.bk.pattern)) { u.p2.pattern = cfg.bk.pattern; if (cfg.bk.start_date) u.p2.startDate = cfg.bk.start_date; }
        if (cfg.meta && !isEnc(cfg.meta.pattern)) {
          if (cfg.meta.pattern) u.p1.name = cfg.meta.pattern;
          if (cfg.meta.start_date && !isEnc(cfg.meta.start_date)) u.p2.name = cfg.meta.start_date;
        }
        var merged = {};
        d.notesRows.forEach(function (r) {
          if (!r.note || isEnc(r.note)) return;
          if (r.date_key.indexOf(prefix) === 0) {
            merged[r.date_key.slice(prefix.length)] = r.note;
          } else if (isDefault && r.date_key.indexOf('::') === -1 && !merged[r.date_key]) {
            merged[r.date_key] = r.note;
          }
        });
        u.notes = merged;
        u.encRows = {};
        finishApply(u, before);
      }

      // 雲端完全沒有我的資料時自動上傳一次（註冊群組成員＋同步姓名），
      // 之後靠正常儲存更新。已鎖定則跳過（等使用者手動儲存，避免沒密碼亂傳）。
      function maybeAutoPublish() {
        if (viewing || autoPublished[currentUser]) return;
        var u = users[currentUser];
        if (!u || u.locked) return;
        var prefix = ownerPrefix();
        var hasMine = cloudCache.configs.some(function (r) { return r.id.indexOf(prefix) === 0; });
        if (hasMine) { autoPublished[currentUser] = true; return; }
        autoPublished[currentUser] = true;
        persistConfig();
        persistNotes();
      }

      function promptUnlockSelf() {
        if (!cryptoOK()) { showToast('此環境不支援解密，請用 HTTPS 開啟'); return; }
        askPassword('你的班表已設密碼').then(function (pw) {
          if (!pw) return;
          tryUnlockSelf(pw);
        });
      }

      function tryUnlockSelf(pw) {
        var u = users[currentUser];
        decryptOwner(u.encRows || { notes: {} }, pw).then(function (plain) {
          if (!plain) {
            showToast('密碼錯誤');
            unlockPrompted[currentUser] = false;
            return;
          }
          sessionKeys[currentUser] = pw;
          if (plain.me) { u.p1.pattern = plain.me.p; if (plain.me.s) u.p1.startDate = plain.me.s; }
          if (plain.bk) { u.p2.pattern = plain.bk.p; if (plain.bk.s) u.p2.startDate = plain.bk.s; }
          if (plain.meta) { if (plain.meta.a) u.p1.name = plain.meta.a; if (plain.meta.b) u.p2.name = plain.meta.b; }
          u.notes = plain.notes;
          notes = u.notes;
          saveUsers();
      // ===== 隱私與密碼 =====
      function renderPrivacy() {
        var u = users[currentUser];
        if (!u) return;
        $('visibleToggle').checked = !!u.visible;
        $('pwStatus').textContent = u.locked ? '已設定（雲端為加密資料）' : '未設定';
        $('btnPwSet').textContent = u.locked ? '變更密碼' : '設定密碼';
        $('btnPwRemove').classList.toggle('hidden', !u.locked);
      }

      $('visibleToggle').addEventListener('change', function() {
        if (viewing) return;
        var u = users[currentUser];

        renderMembers();

      });

      function getMyCloudEnc() {
        var prefix = ownerPrefix();
        var enc = { me: '', bk: '', meta: '', notes: {} };
        cloudCache.configs.forEach(function (r) {
          if (r.id.indexOf(prefix) !== 0) return;
          var kind = r.id.slice(prefix.length);
          if (kind === 'me') enc.me = r.pattern || '';
          else if (kind === 'bk') enc.bk = r.pattern || '';
          else if (kind === 'meta') enc.meta = r.pattern || '';
        });
        cloudCache.notesRows.forEach(function (r) {
          if (r.note && r.date_key.indexOf(prefix) === 0) enc.notes[r.date_key.slice(prefix.length)] = r.note;
        });
        var u = users[currentUser];
        if (!hasAnyEnc(enc) && u.encRows && hasAnyEnc(u.encRows)) return u.encRows;
        return enc;
      }

      function verifyMyPassword(pw) {
        var enc = getMyCloudEnc();
        if (!hasAnyEnc(enc)) return Promise.resolve(true); // 雲端無加密資料，無需驗證
        return decryptOwner(enc, pw).then(function (plain) { return !!plain; });
      }

      $('btnPwSet').addEventListener('click', function() {
        if (viewing) return;
        if (!cryptoOK()) { showToast('此環境不支援加密，請用 HTTPS 開啟'); return; }
        var u = users[currentUser];

          askPassword2('設定密碼（忘記將無法找回）').then(function (pair) {

            persistNotes();

          });
        } else {
          askPassword('先輸入目前密碼').then(function (curPw) {
            if (!curPw) return;
            return verifyMyPassword(curPw).then(function (ok) {

              return askPassword2('輸入新密碼').then(function (pair) {
                if (!pair) return;
                if (!pair[0] || pair[0].length < 4) { showToast('密碼至少 4 碼'); return; }

      function resetOwnerCloud() {
        if (!sb) { showToast('離線中無法重設'); return; }
        var u = users[currentUser];

        }).then(function (res) {

          persistNotes();

      // ===== 群組成員與唯讀查看 =====
      function rowsForOwner(owner) {
        var prefix = String(owner).replace(/:/g, '') + '::';
        var cfg = {};
        cloudCache.configs.forEach(function (r) {
          if (r.id.indexOf(prefix) === 0) {
            var kind = r.id.slice(prefix.length);
            if (!cfg[kind]) cfg[kind] = r;
          }
        });
        var noteRows = cloudCache.notesRows.filter(function (r) {
          return r.note && r.date_key.indexOf(prefix) === 0;
        });
        return { cfg: cfg, noteRows: noteRows, prefix: prefix };
      }

      function snapshotFromPlain(owner, cfg, noteRows, prefix) {
        var p1 = { name: owner, pattern: '', startDate: '' };
        var p2 = { name: '', pattern: '', startDate: '' };
        if (cfg.me && !isEnc(cfg.me.pattern)) { p1.pattern = cfg.me.pattern || ''; p1.startDate = cfg.me.start_date || ''; }
        if (cfg.bk && !isEnc(cfg.bk.pattern)) { p2.pattern = cfg.bk.pattern || ''; p2.startDate = cfg.bk.start_date || ''; }
        if (cfg.meta && !isEnc(cfg.meta.pattern)) {
          if (cfg.meta.pattern) p1.name = cfg.meta.pattern;
          if (cfg.meta.start_date && !isEnc(cfg.meta.start_date)) p2.name = cfg.meta.start_date;
        }
        var nts = {};
        noteRows.forEach(function (r) {
          if (!isEnc(r.note)) nts[r.date_key.slice(prefix.length)] = r.note;
        });
        return { owner: owner, p1: p1, p2: p2, notes: nts, view: 'both' };
      }

      function viewMember(owner) {

        memberList.forEach(function (x) { if (x.owner === owner) m = x; });
        if (!m || !m.visible) { showToast('找不到該成員'); return; }

        if (m.locked) {
          if (!cryptoOK()) { showToast('此環境不支援解密'); return; }
          var keyP = sessionKeys[owner]
            ? Promise.resolve(sessionKeys[owner])
            : askPassword('「' + owner + '」已設密碼', '查看');
          keyP.then(function (pw) {
            if (!pw) return;
            decryptOwner(collectMyEnc(r.cfg, r.noteRows, r.prefix), pw).then(function (plain) {
              if (!plain) { showToast('密碼錯誤'); return; }
              sessionKeys[owner] = pw;
              enterViewing({
                owner: owner,
                p1: { name: (plain.meta && plain.meta.a) || owner, pattern: plain.me ? plain.me.p : '', startDate: plain.me ? plain.me.s : '' },
                p2: { name: (plain.meta && plain.meta.b) || '', pattern: plain.bk ? plain.bk.p : '', startDate: plain.bk ? plain.bk.s : '' },
                notes: plain.notes, view: 'both'
              });
            });
          });
        } else {
          enterViewing(snapshotFromPlain(owner, r.cfg, r.noteRows, r.prefix));

      }

      function prefsRow() {

      // 加密用密碼：未鎖定回傳 null；鎖定則用 session key 或詢問（取消回傳 undefined）
      function ensureKey() {
        var u = users[currentUser];
        if (!u.locked) return Promise.resolve(null);
        if (!cryptoOK()) { showToast('此環境不支援加密，請用 HTTPS 開啟'); return Promise.resolve(null); }
        if (sessionKeys[currentUser]) return Promise.resolve(sessionKeys[currentUser]);
        return askPassword('你的班表已設密碼', '上傳').then(function (pw) {
          if (!pw) { showToast('已取消，僅存本機'); return null; }
          sessionKeys[currentUser] = pw;

        });

      function persistConfig() {
        if (!sb || viewing) return;
        lastLocalSave = Date.now();
        ensureKey().then(function (key) {
          var u = users[currentUser];
          if (!key && u.locked) return;
          var prefix = ownerPrefix();
          if (!u.locked) {
            upsertConfig([
              { id: prefix + 'me', pattern: u.p1.pattern, start_date: u.p1.startDate },
              { id: prefix + 'bk', pattern: u.p2.pattern, start_date: u.p2.startDate },
              { id: prefix + 'meta', pattern: u.p1.name, start_date: u.p2.name },
              prefsRow()
            ]);
            return;
          }
          Promise.all([
            encJSON({ p: u.p1.pattern, s: u.p1.startDate }, key),
            encJSON({ p: u.p2.pattern, s: u.p2.startDate }, key),
            encJSON({ a: u.p1.name, b: u.p2.name }, key)
          ]).then(function (encs) {
            upsertConfig([
              { id: prefix + 'me', pattern: encs[0], start_date: '' },
              { id: prefix + 'bk', pattern: encs[1], start_date: '' },
              { id: prefix + 'meta', pattern: encs[2], start_date: '' },
              prefsRow()
            ]);
          }).catch(function () { showToast('加密失敗'); });
        });
      }

      function persistPrefs() {
        if (!sb || viewing) return;
        lastLocalSave = Date.now();
        upsertConfig([prefsRow()]);
      }

      function persistNotes() {
        if (!sb || viewing) return;
        lastLocalSave = Date.now();
        ensureKey().then(function (key) {
          var u = users[currentUser];
          if (!key && u.locked) return;
          var prefix = ownerPrefix();
          var keys = Object.keys(notes);
          if (!u.locked) {
            upsertNotes(keys.map(function (k) {
              return { date_key: prefix + k, note: notes[k], updated_at: Date.now() };
            }));
            return;
          }
          Promise.all(keys.map(function (k) {
            return encJSON({ t: notes[k] }, key).then(function (e) {
              return { date_key: prefix + k, note: e, updated_at: Date.now() };
            });
          })).then(upsertNotes).catch(function () { showToast('加密失敗'); });
        });
      }

      function subscribe() {

          .on('postgres_changes', { event: '*', schema: 'public', table: 'shift_config' }, function () { refreshQuiet(); })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'shift_notes' }, function () { refreshQuiet(); })
          .subscribe();
        setInterval(function () { refreshQuiet(); }, 15000);

      function parseDate(str) {
        var parts = str.split('-');
        return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
      }

      function getShift(pattern, startDate, year, month, day) {
        if (!pattern || !startDate) return null;
        var start = parseDate(startDate);
        var target = new Date(year, month, day);
        var diffTime = target.getTime() - start.getTime();
        var diff = Math.floor(diffTime / (24 * 60 * 60 * 1000));
        if (diff < 0) return null;
        var idx = diff % pattern.length;
        var code = pattern[idx];
        if (code === '0') return 'off';
        if (code === '1') return 'night';
        if (code === '2') return 'day';
        return null;
      }

      function isMobile() {
        return window.innerWidth <= 640;
      }

      function shortShiftLabel(shift) {
        if (shift === 'day') return '日';
        if (shift === 'night') return '夜';
        if (shift === 'off') return '休';
        return '';
      }

      function shiftLabel(shift) {
        if (shift === 'day') return '日班';
        if (shift === 'night') return '夜班';
        if (shift === 'off') return '休假';
        return '';
      }

      function personShort(name, fallback) {
        name = (name || '').trim();
        return name ? name.charAt(0) : fallback;
      }

      function lunarParts(y, m, d) {
        try {
          if (typeof Lunar === 'undefined') return null;
          var dt = new Date(y, m, d);
          var l = null;
          if (Lunar.fromDate) l = Lunar.fromDate(dt);
          else if (typeof Solar !== 'undefined' && Solar.fromDate) l = Solar.fromDate(dt).getLunar();
          if (!l) return null;
          return { month: l.getMonthInChinese() + '月', day: l.getDayInChinese() };
        } catch (e) { return null; }
      }

      // 格子內顯示：初一顯示月份（正月），其餘顯示日期（初八、十五）
      function lunarText(y, m, d) {
        var p = lunarParts(y, m, d);
        if (!p) return '';
        return p.day === '初一' ? p.month : p.day;
      }

      // 詳情顯示：正月初一
      function lunarFull(y, m, d) {
        var p = lunarParts(y, m, d);
        if (!p) return '';
        return p.month + p.day;
      }

      var HOLIDAY_SHORT = [
        ['除夕', '除夕'], ['春節', '春節'], ['端午', '端午'], ['中秋', '中秋'],
        ['國慶', '國慶'], ['元旦', '元旦'], ['清明', '清明'], ['兒童', '兒童節'],
        ['勞動', '勞動節'], ['和平', '和平日'], ['光復', '光復節'], ['教師', '教師節'],
        ['行憲', '行憲日']
      ];

      function shortHoliday(name) {
        if (!name) return '';
        for (var i = 0; i < HOLIDAY_SHORT.length; i++) {
          if (name.indexOf(HOLIDAY_SHORT[i][0]) !== -1) return HOLIDAY_SHORT[i][1];
        }
        return name.length > 2 ? name.substring(0, 2) : name;
      }

      function holidayNameFor(y, m, d) {
        return holidays[(m + 1) + '-' + d] || lunarHolidays[y + '-' + (m + 1) + '-' + d] || '';
      }

      function dateKey(y, m, d) {
        return y + '-' + (m + 1) + '-' + d;
      }

      function renderCalendar() {
        var u = cur();
        var p1 = u.p1, p2 = u.p2;
        $('appTitle').textContent = '📅 ' + p1.name + p2.name + '輪班表';
        $('appSubtitle').textContent = p1.name + ' & ' + p2.name + '班表合併顯示，輕鬆找出共同放假的日子';
        $('monthTitle').textContent = currentYear + ' 年 ' + (currentMonth + 1) + ' 月';

        var firstDay = new Date(currentYear, currentMonth, 1).getDay();
        var daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        var daysInPrev = new Date(currentYear, currentMonth, 0).getDate();

        var today = new Date();

        var html = '';
        var day = 1;
        var nextDay = 1;

        var totalDays = daysInMonth;
        var totalCells = Math.ceil((firstDay + totalDays) / 7) * 7;

        var p1OffCount = 0, p2OffCount = 0, bothOffCount = 0, sportCount = 0;

        for (var i = 0; i < totalCells; i++) {
          if (i % 7 === 0) html += '<tr>';

          var displayDay, displayMonth, displayYear, isOther;

          if (i < firstDay) {
            displayDay = daysInPrev - firstDay + i + 1;
            displayMonth = currentMonth - 1;
            displayYear = currentYear;
            if (displayMonth < 0) { displayMonth = 11; displayYear--; }
            isOther = true;
          } else if (i >= firstDay + totalDays) {
            displayDay = nextDay++;
            displayMonth = currentMonth + 1;
            displayYear = currentYear;
            if (displayMonth > 11) { displayMonth = 0; displayYear++; }
            isOther = true;
          } else {
            displayDay = day++;
            displayMonth = currentMonth;
            displayYear = currentYear;
            isOther = false;
          }

          var isToday = (displayYear === today.getFullYear() && displayMonth === today.getMonth() && displayDay === today.getDate());

          var p1Shift = getShift(p1.pattern, p1.startDate, displayYear, displayMonth, displayDay);
          var p2Shift = getShift(p2.pattern, p2.startDate, displayYear, displayMonth, displayDay);

          if (!isOther) {
            if (p1Shift === 'off') p1OffCount++;
            if (p2Shift === 'off') p2OffCount++;
            if (p1Shift === 'off' && p2Shift === 'off') bothOffCount++;
          }

          var cellClass = isOther ? 'other-month' : '';
          if (isToday) cellClass += ' today';
          if (!isOther && viewMode === 'both' && p1Shift === 'off' && p2Shift === 'off') cellClass += ' highlight-cell';
          if (!isOther && viewMode === 'p1' && p1Shift === 'off') cellClass += ' highlight-cell';
          if (!isOther && viewMode === 'p2' && p2Shift === 'off') cellClass += ' highlight-cell';

          var badges = '';
          var mob = isMobile();

          if (!isOther) {
            if (viewMode !== 'p2' && p1Shift) {
              badges += mob
                ? '<div class="shift-badge ' + p1Shift + '">' + escHtml(personShort(p1.name, '我')) + shortShiftLabel(p1Shift) + '</div>'
                : '<div class="shift-badge ' + p1Shift + '">' + escHtml(p1.name) + ': ' + shiftLabel(p1Shift) + '</div>';
            }
            if (viewMode !== 'p1' && p2Shift) {
              badges += mob
                ? '<div class="shift-badge ' + p2Shift + '">' + escHtml(personShort(p2.name, '伴')) + shortShiftLabel(p2Shift) + '</div>'
                : '<div class="shift-badge ' + p2Shift + '">' + escHtml(p2.name) + ': ' + shiftLabel(p2Shift) + '</div>';
            }

            if (viewMode === 'both' && p1Shift === 'off' && p2Shift === 'off') {
              var prevP1Shift = getShift(p1.pattern, p1.startDate, displayYear, displayMonth, displayDay - 1);
              var prevP2Shift = getShift(p2.pattern, p2.startDate, displayYear, displayMonth, displayDay - 1);
              badges = '<div class="shift-badge both-off">' + (mob ? '✓ 同休' : '✓ 兩人都休假') + '</div>';
              if (prevP1Shift !== 'night' && prevP2Shift !== 'night') {
                badges += '<div class="sport-icon">🏃</div>';
                sportCount++;
                cellClass += ' sport-cell';
              }
            } else if (viewMode === 'p1' && p1Shift === 'off') {
              badges = '<div class="shift-badge off">' + (mob ? '✓ 休' : '✓ 休假') + '</div>';
            } else if (viewMode === 'p2' && p2Shift === 'off') {
              badges = '<div class="shift-badge off">' + (mob ? '✓ 休' : '✓ 休假') + '</div>';
            }
          }

          var dk = dateKey(displayYear, displayMonth, displayDay);
          var noteText = notes[dk];
          var holidayName = holidayNameFor(displayYear, displayMonth, displayDay);

          if (!isOther && holidayName) {
            cellClass += ' holiday-cell';
            var showName = mob ? shortHoliday(holidayName) : holidayName;
            badges += '<div class="holiday-icon" title="' + escHtml(holidayName) + '">' + escHtml(showName) + '</div>';
          }
          if (!isOther && noteText) {
            badges += '<div class="note-icon">📝 ' + escHtml(noteText.substring(0, mob ? 3 : 6)) + (noteText.length > (mob ? 3 : 6) ? '...' : '') + '</div>';
          }

          html += '<td class="' + cellClass + '"' + (!isOther ? ' data-date="' + dk + '"' : '') + '>';
          var lunar = lunarText(displayYear, displayMonth, displayDay);
          html += '<div class="day-row"><div class="day-num">' + displayDay + '</div>' + (lunar ? '<div class="lunar-date">' + lunar + '</div>' : '') + '</div>';
          html += badges;
          html += '</td>';

          if (i % 7 === 6) html += '</tr>';
        }

        $('calendarBody').innerHTML = html;

        var summaryHtml = '';
        if (viewMode === 'both') {
          summaryHtml =
            '<div class="summary-card"><div class="value">' + p1OffCount + '</div><div class="label">' + escHtml(p1.name) + '休假天數</div></div>' +
            '<div class="summary-card"><div class="value">' + p2OffCount + '</div><div class="label">' + escHtml(p2.name) + '休假天數</div></div>' +
            '<div class="summary-card"><div class="value" style="color:#16a34a">' + bothOffCount + '</div><div class="label">共同休假天數</div></div>' +
            '<div class="summary-card"><div class="value" style="color:#ea580c">' + sportCount + '</div><div class="label">🏃 運動天數</div></div>';
        } else if (viewMode === 'p1') {
          summaryHtml =
            '<div class="summary-card"><div class="value">' + p1OffCount + '</div><div class="label">' + escHtml(p1.name) + '休假天數</div></div>';
        } else {
          summaryHtml =
            '<div class="summary-card"><div class="value">' + p2OffCount + '</div><div class="label">' + escHtml(p2.name) + '休假天數</div></div>';
        }
        $('summaryBox').innerHTML = summaryHtml;

        $('calendarBody').querySelectorAll('td[data-date]').forEach(function(td) {
          td.addEventListener('click', function() {
            openNoteModal(td.dataset.date);
          });
        });
      }

      function escHtml(s) {
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }

      function openNoteModal(dk) {
        var existing = notes[dk] || '';
        var parts = dk.split('-');
        var y = parseInt(parts[0]);
        var m = parseInt(parts[1]) - 1;
        var d = parseInt(parts[2]);
        var u = cur();
        var p1Shift = getShift(u.p1.pattern, u.p1.startDate, y, m, d);
        var p2Shift = getShift(u.p2.pattern, u.p2.startDate, y, m, d);

        var shiftInfo = escHtml(u.p1.name) + ': ' + shiftLabel(p1Shift) + ' ｜ ' + escHtml(u.p2.name) + ': ' + shiftLabel(p2Shift);
        if (p1Shift === 'off' && p2Shift === 'off') {
          shiftInfo += '  ★ 共同休假';
        }

        var lunarDay = lunarFull(y, m, d);
        if (lunarDay) {
          shiftInfo += '<br>🌙 農曆：' + lunarDay;
        }
        var holidayName = holidayNameFor(y, m, d);
        if (holidayName) {
          shiftInfo += '<br>🎉 假日：' + escHtml(holidayName);
        }

        var modalBody = viewing
          ? '<div class="shift-info">' + (existing ? escHtml(existing) : '（無備註）') + '</div>' +
            '<div class="modal-btns"><button type="button" id="btnCancelNote">關閉</button></div>'
          : '<textarea id="noteInput" placeholder="輸入備註事項...">' + escHtml(existing) + '</textarea>' +
            '<div class="modal-btns">' +
            (existing ? '<button type="button" class="btn-delete" id="btnDelNote">刪除</button>' : '') +
            '<button type="button" id="btnCancelNote">取消</button>' +
            '<button type="button" class="btn-save" id="btnSaveNote">儲存</button>' +
            '</div>';

        var html = '<div class="modal-overlay" id="noteModal">' +
          '<div class="modal">' +
          '<h3>' + y + ' 年 ' + (m + 1) + ' 月 ' + d + ' 日</h3>' +
          '<div class="shift-info">' + shiftInfo + '</div>' +
          modalBody +
          '</div>' +
          '</div>';

        $('modalContainer').innerHTML = html;

        $('btnCancelNote').addEventListener('click', closeModal);
        if ($('btnSaveNote')) {
        $('btnSaveNote').addEventListener('click', function() {
          var val = $('noteInput').value.trim();
          if (val) {
            notes[dk] = val;
          } else {
            delete notes[dk];
          }
          saveUsers();
          lastLocalSave = Date.now();
          persistNotes();
          closeModal();
          renderCalendar();
          showToast('已儲存備註');
        });
        }

        if ($('btnDelNote')) {
          $('btnDelNote').addEventListener('click', function() {
            delete notes[dk];
          saveUsers();
          lastLocalSave = Date.now();
          persistNotes();
          closeModal();
          renderCalendar();
          showToast('已刪除備註');
          });
        }

        $('noteModal').addEventListener('click', function(e) {
          if (e.target === $('noteModal')) closeModal();
        });

        if ($('noteInput')) $('noteInput').focus();
      }

      function closeModal() {
        $('modalContainer').innerHTML = '';
      }

      // ===== 通用輸入框（取代系統 prompt/confirm，PWA 與內建瀏覽器可用）=====
      // askModal 回傳 Promise：確定 -> 輸入值陣列；取消/點背景 -> null
      function askModal(title, bodyHtml, okText) {
        return new Promise(function (resolve) {
          $('modalContainer').innerHTML = '<div class="modal-overlay" id="noteModal">' +
            '<div class="modal">' +
            '<h3>' + escHtml(title) + '</h3>' + bodyHtml +
            '<div class="modal-btns">' +
            '<button type="button" id="askCancel">取消</button>' +
            '<button type="button" class="btn-save" id="askOk">' + escHtml(okText || '確定') + '</button>' +
            '</div>' +
            '</div>' +
            '</div>';
          function done(v) { closeModal(); resolve(v); }
          $('askCancel').addEventListener('click', function() { done(null); });
          $('askOk').addEventListener('click', function() {
            var vals = [];
            $('modalContainer').querySelectorAll('[data-ask]').forEach(function(el) { vals.push(el.value); });
            done(vals);
          });
          $('noteModal').addEventListener('click', function(e) { if (e.target === $('noteModal')) done(null); });
          var first = $('modalContainer').querySelector('[data-ask]');
          if (first) first.focus();
        });
      }

      function askText(title, placeholder, okText) {
        return askModal(title,
          '<input data-ask class="ask-input" type="text" placeholder="' + escHtml(placeholder || '') + '">',
          okText).then(function(v) { return v ? v[0].trim() : null; });
      }

      function askPassword(title, okText) {
        return askModal(title,
          '<input data-ask class="ask-input" type="password" placeholder="請輸入密碼" autocomplete="off">',
          okText || '確定').then(function(v) { return v ? v[0] : null; });
      }

      function askPassword2(title) {
        return askModal(title,
          '<input data-ask class="ask-input" type="password" placeholder="新密碼（至少 4 碼）" autocomplete="new-password">' +
          '<input data-ask class="ask-input" type="password" placeholder="再輸入一次確認" autocomplete="new-password">',
          '確定').then(function(v) { return v ? [v[0] || '', v[1] || ''] : null; });
      }

      function askConfirm(title, msgHtml, okText) {
        return askModal(title, '<div class="shift-info">' + msgHtml + '</div>', okText || '確定')
          .then(function(v) { return !!v; });
      }

      function openJumpModal() {
        var years = '';
        for (var y = currentYear - 10; y <= currentYear + 10; y++) {
          years += '<option value="' + y + '"' + (y === currentYear ? ' selected' : '') + '>' + y + ' 年</option>';
        }
        var months = '';
        for (var m = 1; m <= 12; m++) {
          months += '<option value="' + (m - 1) + '"' + ((m - 1) === currentMonth ? ' selected' : '') + '>' + m + ' 月</option>';
        }
        $('modalContainer').innerHTML = '<div class="modal-overlay" id="noteModal">' +
          '<div class="modal">' +
          '<h3>選擇年月</h3>' +
          '<div class="jump-row"><select id="jumpYear">' + years + '</select>' +
          '<select id="jumpMonth">' + months + '</select></div>' +
          '<div class="modal-btns">' +
          '<button type="button" id="btnCancelJump">取消</button>' +
          '<button type="button" class="btn-save" id="btnGoJump">前往</button>' +
          '</div>' +
          '</div>' +
          '</div>';

        $('btnCancelJump').addEventListener('click', closeModal);
        $('btnGoJump').addEventListener('click', function() {
          currentYear = parseInt($('jumpYear').value, 10);
          currentMonth = parseInt($('jumpMonth').value, 10);
          closeModal();
          renderCalendar();
        });
        $('noteModal').addEventListener('click', function(e) {
          if (e.target === $('noteModal')) closeModal();
        });
      }

      function applySettings() {
        if (viewing) return;
        var u = cur();
        u.p1.name = $('p1Name').value.trim() || u.p1.name || '我';
        u.p1.pattern = $('myPattern').value.trim();
        u.p1.startDate = $('myStartDate').value;
        u.p2.name = $('p2Name').value.trim() || u.p2.name || '伴侶';
        u.p2.pattern = $('bkPattern').value.trim();
        u.p2.startDate = $('bkStartDate').value;
        lastLocalSave = Date.now();
        saveUsers();
        persistConfig();
        loadForm();
        renderUserBar();
        renderCalendar();
        showToast('已更新班表');
      }

      function setIfIdle(id, val) {
        var el = $(id);
        if (!el) return;
        if (document.activeElement === el) return; // 使用者正在輸入，不覆寫
        if (el.value !== val) el.value = val;
      }

      function loadForm() {
        var u = cur();
        setIfIdle('p1Name', u.p1.name || '');
        setIfIdle('myPattern', u.p1.pattern || '');
        setIfIdle('myStartDate', u.p1.startDate || '');
        setIfIdle('p2Name', u.p2.name || '');
        setIfIdle('bkPattern', u.p2.pattern || '');
        setIfIdle('bkStartDate', u.p2.startDate || '');
        $('p1Heading').innerHTML = '<span class="dot dot-me"></span>' + escHtml(u.p1.name || '') + '班表';
        $('p2Heading').innerHTML = '<span class="dot dot-bk"></span>' + escHtml(u.p2.name || '') + '班表';
      }

      $('btnApply').addEventListener('click', applySettings);

      $('btnTogglePattern').addEventListener('click', function() {
        var fields = document.querySelectorAll('.pattern-field');
        var anyHidden = false;
        fields.forEach(function(f) { if (f.classList.contains('hidden')) anyHidden = true; });
        fields.forEach(function(f) { f.classList.toggle('hidden', !anyHidden); });
        this.textContent = anyHidden ? '⚙️ 隱藏輪班規則' : '⚙️ 顯示輪班規則';
      });

      $('btnPrev').addEventListener('click', function() {
        currentMonth--;
        if (currentMonth < 0) { currentMonth = 11; currentYear--; }
        renderCalendar();
      });

      $('btnNext').addEventListener('click', function() {
        currentMonth++;
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        renderCalendar();
      });

      $('btnToday').addEventListener('click', function() {
        var now = new Date();
        currentYear = now.getFullYear();
        currentMonth = now.getMonth();
        renderCalendar();
      });

      $('monthTitle').title = '點選可直接選擇年月';
      $('monthTitle').addEventListener('click', openJumpModal);

      document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft') {
          $('btnPrev').click();
        } else if (e.key === 'ArrowRight') {
          $('btnNext').click();
        }
      });

      // 手機左右滑動切換月份
      var touchStartX = 0;
      var touchStartY = 0;
      var touchMoved = false;
      document.querySelector('.calendar').addEventListener('touchstart', function(e) {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
        touchMoved = false;
      }, { passive: true });
      document.querySelector('.calendar').addEventListener('touchmove', function(e) {
        var dx = e.changedTouches[0].screenX - touchStartX;
        var dy = e.changedTouches[0].screenY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
          touchMoved = true;
        }
      }, { passive: true });
      document.querySelector('.calendar').addEventListener('touchend', function(e) {
        if (!touchMoved) return;
        var dx = e.changedTouches[0].screenX - touchStartX;
        if (Math.abs(dx) > 50) {
          if (dx < 0) {
            $('btnNext').click();
          } else {
            $('btnPrev').click();
          }
        }
        touchMoved = false;
      }, { passive: true });

      $('viewToggle').querySelectorAll('button').forEach(function(btn) {
        btn.addEventListener('click', function() {
          viewMode = btn.dataset.view;
          saveView();
          $('viewToggle').querySelectorAll('button').forEach(function(b) {
            b.classList.toggle('active', b === btn);
          });
          renderCalendar();
        });
      });

      function initViewToggle() {
        $('viewToggle').querySelectorAll('button').forEach(function(btn) {
          btn.classList.toggle('active', btn.dataset.view === viewMode);
        });
      }

      // ===== 使用者選單 =====
      function renderUserBar() {
        var sel = $('userSelect');
        sel.innerHTML = Object.keys(users).map(function(n) {
          return '<option value="' + escHtml(n) + '"' + (n === currentUser ? ' selected' : '') + '>' + escHtml(n) + '</option>';
        }).join('');
        var u = cur();
        $('viewBtnP1').textContent = '只顯示' + u.p1.name;
        $('viewBtnP2').textContent = '只顯示' + u.p2.name;
      }

      function switchUser(name) {
        if (!users[name]) return;
        viewing = null;
        $('settingsCard').classList.remove('hidden');
        $('viewBanner').classList.add('hidden');
        currentUser = name;
        viewMode = users[name].view || 'both';
        notes = users[name].notes || {};
        saveUsers();
        loadForm();
        renderUserBar();
        renderPrivacy();
        initViewToggle();
        renderCalendar();
        persistPrefs();
        refreshQuiet();
      }

      $('userSelect').addEventListener('change', function() {
        switchUser(this.value);
      });

      $('btnAddUser').addEventListener('click', function() {
        askText('新增使用者', '例如：小明', '新增').then(function(name) {
          if (!name) return;
          name = name.replace(/:/g, '');
          if (!name) { showToast('名稱不可空白'); return; }
          if (users[name]) { showToast('此名稱已存在'); return; }
          users[name] = { name: name, p1: blankPerson('我'), p2: blankPerson('伴侶'), notes: {}, view: 'both', visible: true, locked: false, encRows: {} };
          switchUser(name);
          var fields = document.querySelectorAll('.pattern-field');
          var anyHidden = false;
          fields.forEach(function(f) { if (f.classList.contains('hidden')) anyHidden = true; });
          if (anyHidden) $('btnTogglePattern').click();
          showToast('已新增「' + name + '」，請填寫輪班規則');
        });
      });

      $('btnDelUser').addEventListener('click', function() {
        var names = Object.keys(users);
        if (names.length <= 1) { showToast('至少保留一位使用者'); return; }
        askConfirm('刪除使用者',
          '確定刪除「' + escHtml(currentUser) + '」？<br>（雲端資料會保留，日後用相同名稱重建可找回）',
          '刪除').then(function(ok) {
          if (!ok) return;
          delete users[currentUser];
          switchUser(Object.keys(users)[0]);
          showToast('已刪除');
        });
      });

      loadForm();
      renderUserBar();
      renderPrivacy();
      renderMembers();
      initViewToggle();
      renderCalendar();
      startApp();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
      }
    })();
  </script>
</body>
</html>
